*{

}

.header-content{
    max-width:1200px;
    margin:auto;
    display:flex;

    align-items:center;
}

.logo{

}

nav{
    display:flex;
    gap:18px;
}

nav a{
    color:white;

}

nav a:hover{
    color:#00b7ff;
}

.search-box{
    max-width:1200px;
    margin:20px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#121827;
    color:white;
    font-size:16px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hero{
    background:#0d111c;
    padding:40px 20px;
    border-radius:18px;
    text-align:center;
    margin-bottom:30px;
}

.hero h1{
    color:#00b7ff;
    margin-bottom:12px;
}

.hero p{
    color:#b9c0ce;
}

.section-title{
    color:#00b7ff;
    margin-bottom:18px;
}

.anime-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.anime-card{
    display:block;
    background:#0d111c;
    border-radius:14px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.anime-card:hover{
    transform:translateY(-5px);
}

.poster{
    width:100%;
    height:300px;
    background:#121827;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.anime-info{
    padding:12px;
    text-align:center;
}

.anime-info h3{
    font-size:15px;
    margin-bottom:8px;
}

.episodes-count{
    color:#9fa8b8;
    font-size:13px;
}

.no-results{
    display:none;
    text-align:center;
    padding:40px;
    color:#aaa;
    grid-column:1/-1;
}

.episodes{
    margin-top:40px;
}

.episode-card{
    background:#0d111c;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.episode-card a{
    background:#1687d9;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
}

footer{
    text-align:center;
    color:#777;
    padding:35px 10px;
    margin-top:30px;
}

@media(max-width:1000px){

    .anime-grid{
        grid-template-columns:repeat(4,1fr);
    }

}

@media(max-width:800px){

    .anime-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .poster{
        height:260px;
    }

}

@media(max-width:600px){

    .header-content{
        flex-direction:column;
        gap:12px;
    }

    .anime-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .poster{
        height:240px;
    }

}

function createAnimeCards(){

    const grid =
    document.getElementById("animeGrid");

    grid.innerHTML = "";

    animeList.forEach(function(anime){

        const card =
        document.createElement("a");

        card.className =
        "anime-card";

        /*
        الأنميات التي لها صفحات حاليًا
        */

        if(anime.link){

            card.href =
            anime.link;

        }else{

            /*
            الصفحة العامة التي سننشئها
            في الخطوة التالية
            */

            card.href =
            "anime.html?name=" +
            encodeURIComponent(anime.name);

        }


        const poster =
        document.createElement("div");

        poster.className =
        "poster";


        const img =
        document.createElement("img");


        /*
        إذا كان للأنمي غلاف موجود
        استخدمه، وإلا استخدم الغلاف المؤقت
        */

        img.src =
        anime.image || defaultImage;

        img.alt =
        anime.name;


        img.onerror =
        function(){

            this.src =
            defaultImage;

        };


        poster.appendChild(img);


        const info =
        document.createElement("div");

        info.className =
        "anime-info";


        const title =
        document.createElement("h3");

        title.textContent =
        anime.name;


        const episodes =
        document.createElement("div");

        episodes.className =
        "episodes-count";

        episodes.textContent =
        "عدد الحلقات: " +
        anime.episodes;


        info.appendChild(title);

        info.appendChild(episodes);


        card.appendChild(poster);

        card.appendChild(info);


        grid.appendChild(card);

    });

}

=================================================
*/

function searchAnime(){

    const input =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


    const cards =
    document.querySelectorAll(
        ".anime-card"
    );


    let found = 0;


    cards.forEach(function(card){

        const text =
        card.innerText.toLowerCase();


        if(text.includes(input)){

            card.style.display =
            "block";

            found++;

        }else{

            card.style.display =
            "none";

        }

    });


    const noResults =
    document.getElementById("noResults");


    if(found === 0){

        noResults.style.display =
        "block";

    }else{

        noResults.style.display =
        "none";

    }

}
