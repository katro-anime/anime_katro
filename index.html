/* =====================================================
   إزالة التكرار
===================================================== */

const uniqueAnimeList =
[...new Set(animeList)];


/* =====================================================
   تحويل الاسم إلى رابط صفحة الأنمي
===================================================== */

function animeLink(name){

    /*
       Solo Leveling Season 2 لا يظهر كأنمي مستقل
    */

    if(name === "Solo Leveling Season 2"){
        return "anime.html?name=" +
        encodeURIComponent("Solo Leveling");
    }

    return "anime.html?name=" +
    encodeURIComponent(name);
}


/* =====================================================
   إنشاء البطاقات فورًا
===================================================== */

const grid =
document.getElementById("animeGrid");


function createCards(list){

    grid.innerHTML = "";

    list.forEach((name,index)=>{

        const card =
        document.createElement("a");

        card.className = "card";

        card.href = animeLink(name);

        const image =
        document.createElement("img");

        image.src = defaultCover;

        image.alt = name;

        image.dataset.name = name;

        image.className = "loading-cover";

        const content =
        document.createElement("div");

        content.className = "card-content";

        content.innerHTML = `
            <h3>${name}</h3>
            <p>KATRO Anime</p>
        `;

        card.appendChild(image);
        card.appendChild(content);

        grid.appendChild(card);

    });

}


/* =====================================================
   عرض الأنميات مباشرة
===================================================== */

createCards(uniqueAnimeList);


/* =====================================================
   ذاكرة الأغلفة
===================================================== */

function getCache(){

    try{

        return JSON.parse(
            localStorage.getItem("katroAnimeCovers") || "{}"
        );

    }catch(e){

        return {};

    }

}


function saveCache(cache){

    try{

        localStorage.setItem(
            "katroAnimeCovers",
            JSON.stringify(cache)
        );

    }catch(e){}

}


/* =====================================================
   جلب غلاف واحد
   الصفحة لا تنتظر الغلاف
===================================================== */

async function getCover(name){

    const cache = getCache();

    if(cache[name]){
        return cache[name];
    }

    try{

        const response =
        await fetch(
            "https://api.jikan.moe/v4/anime?q=" +
            encodeURIComponent(name) +
            "&limit=1"
        );

        if(!response.ok){
            return null;
        }

        const json =
        await response.json();

        if(
            json.data &&
            json.data.length &&
            json.data[0].images &&
            json.data[0].images.jpg
        ){

            const image =
            json.data[0].images.jpg.large_image_url ||
            json.data[0].images.jpg.image_url;

            if(image){

                cache[name] = image;

                saveCache(cache);

                return image;

            }

        }

    }catch(error){

        return null;

    }

    return null;

}


/* =====================================================
   تحميل الأغلفة بهدوء
   3 طلبات فقط في نفس الوقت
===================================================== */

async function loadCovers(){

    const images =
    [...document.querySelectorAll(".card img")];

    let index = 0;

    async function worker(){

        while(index < images.length){

            const current =
            images[index++];

            const name =
            current.dataset.name;

            /*
               لا نبحث عن الموسم الثاني كأنمي مستقل
            */

            if(name === "Solo Leveling Season 2"){
                continue;
            }

            const cover =
            await getCover(name);

            if(cover){

                current.src = cover;

                current.classList.remove(
                    "loading-cover"
                );

            }else{

                current.src = defaultCover;

                current.classList.remove(
                    "loading-cover"
                );

            }

        }

    }

    await Promise.all([
        worker(),
        worker(),
        worker()
    ]);

}


loadCovers();


/* =====================================================
   البحث
===================================================== */

function searchAnime(){

    const value =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    const filtered =
    uniqueAnimeList.filter(name =>
        name.toLowerCase().includes(value)
    );

    createCards(filtered);

    /*
       إعادة تحميل الأغلفة للنتائج
    */

    loadCovers();

}
