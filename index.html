
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATRO Anime</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1b2638;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#00b7ff;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

nav{
    display:flex;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#111827;
    padding:9px 14px;
    border-radius:8px;
}

nav a:hover{
    background:#1687d9;
}

.search{
    width:92%;
    max-width:1000px;
    margin:25px auto;
}

.search input{
    width:100%;
    padding:15px;
    border:1px solid #1b2638;
    outline:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
}

.hero{
    width:92%;
    max-width:1100px;
    margin:20px auto;
    padding:40px 20px;
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:15px;
    text-align:center;
}

.hero h1{
    color:#00b7ff;
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    color:#94a3b8;
}

.container{
    width:92%;
    max-width:1200px;
    margin:30px auto;
}

.title{
    color:#00b7ff;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:18px;
}

.card{
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00b7ff;
}

.poster{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
    background:#111827;
}

.card-info{
    padding:12px;
}

.card-info h3{
    font-size:16px;
    margin-bottom:6px;
}

.card-info p{
    color:#94a3b8;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:25px;
    color:#38b5ff;
}

.social-section{
    margin-top:25px;
    padding:25px 10px;
    border-top:1px solid #1b2638;
    text-align:center;
}

.social-section h3{
    color:#00b7ff;
    margin-bottom:25px;
}

.social-links{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:45px;
    flex-wrap:wrap;
}

.social-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.social-item:hover{
    transform:translateY(-5px);
}

.social-icon{
    width:55px;
    height:55px;
}

.tiktok-icon{fill:white}
.youtube-icon{fill:#ff0033}

.social-name{
    font-size:16px;
    font-weight:bold;
}

.social-url{
    color:#00b7ff;
    font-size:13px;
}

footer{
    text-align:center;
    color:#64748b;
    padding:30px 15px;
}

@media(max-width:600px){
    header{flex-direction:column}

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .poster{height:220px}
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">KATRO Anime</a>

<nav>
<a href="index.html">الرئيسية</a>
<a href="index.html">الأنمي</a>
</nav>
</header>

<div class="search">
<input id="search" type="text" placeholder="ابحث عن الأنمي...">
</div>

<section class="hero">
<h1>KATRO Anime</h1>
<p>أفضل الأنميات في مكان واحد</p>
</section>

<div class="container">
<h2 class="title">جميع الأنميات</h2>
<div id="animeGrid" class="grid">
<div class="loading">جاري تحميل الأنميات...</div>
</div>
</div>

<footer>

<div class="social-section">
<h3>تابع KATRO Anime</h3>

<div class="social-links">

<a class="social-item"
href="https://www.tiktok.com/@katro10k"
target="_blank"
rel="noopener noreferrer">

<svg class="social-icon tiktok-icon"
viewBox="0 0 24 24"
xmlns="http://www.w3.org/2000/svg">
<path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.5v13.67a2.9 2.9 0 0 1-2.9 2.9 2.9 2.9 0 0 1-2.9-2.9 2.9 2.9 0 0 1 2.9-2.9c.28 0 .55.04.8.12V9.32a6.4 6.4 0 00-.8-.05A6.4 6.4 0 0 0 3 15.67a6.4 6.4 0 0 0 6.42 6.4 6.4 6.4 0 00 6.4-6.4V9.1a8.2 8.2 0 00 4.8 1.54V7.13a4.8 4.8 0 0 1-1.03-.44z"/>
</svg>

<span class="social-name">TikTok</span>
<span class="social-url">@katro10k</span>
</a>

<a class="social-item"
href="https://youtube.com/@katro10k"
target="_blank"
rel="noopener noreferrer">

<svg class="social-icon youtube-icon"
viewBox="0 0 24 24"
xmlns="http://www.w3.org/2000/svg">
<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 00-.5-5.8zM9.6 15.6V8.4l6.3 3.6z"/>
</svg>

<span class="social-name">YouTube</span>
<span class="social-url">@katro10k</span>
</a>

</div>
</div>

© 2026 KATRO Anime
</footer>

<script src="./anime-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded",function(){

const grid=document.getElementById("animeGrid");
const search=document.getElementById("search");

function makeCard(name){

const anime=getAnime(name);
if(!anime)return null;

const card=document.createElement("a");
card.className="card";
card.href="anime.html?name="+encodeURIComponent(name);

const img=document.createElement("img");
img.className="poster";
img.alt=name;
img.loading="lazy";

function updateCover(){
if(anime.cover){
img.src=anime.cover;
}else{
img.removeAttribute("src");
}
}

updateCover();

const info=document.createElement("div");
info.className="card-info";

const title=document.createElement("h3");
title.textContent=anime.title;

const seasons=document.createElement("p");
seasons.textContent=(anime.seasons||[]).length+" موسم";

info.appendChild(title);
info.appendChild(seasons);

card.appendChild(img);
card.appendChild(info);

return card;
}

function render(names){

grid.innerHTML="";

if(!names.length){
grid.innerHTML="<p>لا توجد نتائج.</p>";
return;
}

names.forEach(name=>{
const card=makeCard(name);
if(card)grid.appendChild(card);
});
}

function searchAnime(){
const value=search.value.trim().toLowerCase();

const results=getAnimeNames().filter(name=>{
const anime=getAnime(name);
return name.toLowerCase().includes(value)||
(anime.title||"").toLowerCase().includes(value);
});

render(results);
}

search.addEventListener("input",searchAnime);

render(getAnimeNames());

/* Redraw when AniList covers finish loading */
document.addEventListener("KATRO_DATA_UPDATED",function(){
searchAnime();
});

});
</script>

</body>
</html>
