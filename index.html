<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KATRO Anime</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

/* الهيدر */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #0d111c;
    border-bottom: 1px solid #202738;
    padding: 15px 20px;
}

.header-content {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    color: #00b7ff;
    font-size: 25px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 18px;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #00b7ff;
}

/* البحث */
.search-box {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px;
}

.search-box input {
    width: 100%;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: #121827;
    color: white;
    font-size: 15px;
}

/* المحتوى */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* الترحيب */
.hero {
    background: linear-gradient(135deg, #0d1628, #111827);
    padding: 40px 20px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 12px;
    color: #00b7ff;
}

.hero p {
    color: #b9c0ce;
}

/* العناوين */
.section-title {
    font-size: 24px;
    margin-bottom: 18px;
    color: #00b7ff;
}

/* شبكة الأنميات */
.anime-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.anime-card {
    display: block;
    background: #0d111c;
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    transition: transform 0.2s, box-shadow 0.2s;
}

.anime-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0, 183, 255, 0.15);
}

.poster {
    width: 100%;
    height: 300px;
    overflow: hidden;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.anime-card h3 {
    padding: 15px;
    text-align: center;
    font-size: 17px;
}

/* الحلقات */
.episodes {
    margin-top: 40px;
}

.episode-card {
    background: #0d111c;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.episode-card a {
    background: #1687d9;
    color: white;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
}

/* الفوتر */
footer {
    text-align: center;
    color: #777;
    padding: 35px 10px;
    margin-top: 30px;
}

/* الهاتف */
@media (max-width: 800px) {
    .anime-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .poster {
        height: 260px;
    }
}

@media (max-width: 500px) {
    .header-content {
        flex-direction: column;
    }

    nav {
        width: 100%;
        justify-content: center;
    }

    .hero h1 {
        font-size: 26px;
    }

    .anime-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .poster {
        height: 220px;
    }

    .anime-card h3 {
        font-size: 15px;
        padding: 12px 5px;
    }
}
</style>

</head>

<body>

<!-- الهيدر -->
<header>

    <div class="header-content">

        <div class="logo">
            KATRO Anime
        </div>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="#anime">الأنميات</a>
            <a href="#episodes">الحلقات</a>
        </nav>

    </div>

</header>


<!-- البحث -->
<div class="search-box">

    <input
        type="text"
        placeholder="ابحث عن الأنمي..."
        onkeyup="searchAnime()"
        id="searchInput"
    >

</div>


<!-- المحتوى -->
<div class="container">

    <!-- الترحيب -->
    <section class="hero">

        <h1>
            عالم الأنمي بين يديك 🔥
        </h1>

        <p>
            KATRO Anime — عالمك الخاص للأنمي
        </p>

    </section>


    <!-- الأنميات -->
    <section id="anime">

        <h2 class="section-title">
            الأنميات
        </h2>


        <div class="anime-grid" id="animeGrid">


            <!-- Demon Slayer -->
            <a
                href="demon-slayer.html"
                class="anime-card"
                data-name="Demon Slayer ديمون سلاير"
            >

                <div class="poster">

                    <img
                        src="5a02947aed465c5b6a721884a87cdeca.jpg"
                        alt="Demon Slayer"
                    >

                </div>

                <h3>
                    Demon Slayer
                </h3>

            </a>


            <!-- Solo Leveling -->
            <a
                href="solo-leveling.html"
                class="anime-card"
                data-name="Solo Leveling سولو لفلينغ"
            >

                <div class="poster">

                    <img
                        src="Solo leveling .jpg"
                        alt="Solo Leveling"
                    >

                </div>

                <h3>
                    Solo Leveling
                </h3>

            </a>


            <!-- Dragon Ball -->
            <a
                href="#"
                class="anime-card"
                data-name="Dragon Ball دراغون بول"
            >

                <div class="poster">

                    <img
                        src="Dragon Ball.jpg"
                        alt="Dragon Ball"
                    >

                </div>

                <h3>
                    Dragon Ball
                </h3>

            </a>


            <!-- One Piece -->
            <a
                href="#"
                class="anime-card"
                data-name="One Piece ون بيس"
            >

                <div class="poster">

                    <img
                        src="one_piece.jpg"
                        alt="One Piece"
                    >

                </div>

                <h3>
                    One Piece
                </h3>

            </a>


        </div>

    </section>


    <!-- أحدث الحلقات -->
    <section class="episodes" id="episodes">

        <h2 class="section-title">
            أحدث الحلقات
        </h2>


        <div class="episode-card">

            <span>
                Demon Slayer — الحلقة 1
            </span>

            <a href="demon-slayer.html">
                مشاهدة
            </a>

        </div>


        <div class="episode-card">

            <span>
                Solo Leveling — الحلقة 1
            </span>

            <a href="solo-leveling.html">
                مشاهدة
            </a>

        </div>


    </section>

</div>


<!-- الفوتر -->
<footer>

    © 2026 KATRO Anime

</footer>


<script>

function searchAnime() {

    let input =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    let cards =
        document.querySelectorAll(".anime-card");

    cards.forEach(function(card) {

        let name =
            card
            .getAttribute("data-name")
            .toLowerCase();

        if (name.includes(input)) {

            card.style.display = "block";

        } else {

            card.style.display = "none";

        }

    });

}

</script>

</body>
                      </html>
