<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KATRO Anime</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

header {
    background: #0d111c;
    padding: 15px 20px;
    border-bottom: 1px solid #202738;
}

.header-content {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #00b7ff;
    font-size: 25px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 18px;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search-box {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px;
}

.search-box input {
    width: 100%;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: #121827;
    color: white;
    font-size: 15px;
}

.hero {
    background: #0d111c;
    padding: 40px 20px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    color: #00b7ff;
    margin-bottom: 12px;
}

.hero p {
    color: #b9c0ce;
}

.section-title {
    color: #00b7ff;
    margin-bottom: 18px;
}

.anime-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.anime-card {
    display: block;
    background: #0d111c;
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: white;
}

.anime-card:hover {
    transform: translateY(-5px);
}

.poster {
    width: 100%;
    height: 300px;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.anime-card h3 {
    padding: 15px;
    text-align: center;
}

.episodes {
    margin-top: 40px;
}

.episode-card {
    background: #0d111c;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.episode-card a {
    background: #1687d9;
    color: white;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
}

footer {
    text-align: center;
    color: #777;
    padding: 35px 10px;
}

@media (max-width: 800px) {
    .anime-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .poster {
        height: 250px;
    }
}

@media (max-width: 500px) {
    .header-content {
        flex-direction: column;
        gap: 12px;
    }

    .anime-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .poster {
        height: 220px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-content">

<div class="logo">
KATRO Anime
</div>

<nav>
<a href="index.html">الرئيسية</a>
<a href="#anime">الأنميات</a>
<a href="#episodes">الحلقات</a>
</nav>

</div>

</header>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="ابحث عن الأنمي..."
onkeyup="searchAnime()">

</div>


<div class="container">

<section class="hero">

<h1>
عالم الأنمي بين يديك 🔥
</h1>

<p>
KATRO Anime — عالمك الخاص للأنمي
</p>

</section>


<section id="anime">

<h2 class="section-title">
الأنميات
</h2>


<div class="anime-grid">


<!-- Demon Slayer -->

<a href="demon-slayer.html" class="anime-card">

<div class="poster">

<img
src="5a02947aed465c5b6a721884a87cdeca.jpg"
alt="Demon Slayer">

</div>

<h3>
Demon Slayer
</h3>

</a>


<!-- Solo Leveling -->

<a href="solo-leveling.html" class="anime-card">

src="Solo leveling .jpg"

Solo Leveling

<!-- Dragon Ball -->

<div class="poster">

</div>

<h3>
Dragon Ball
</h3>

</a>


<!-- One Piece -->

<a href="one-piece.html" class="anime-card">

<div class="poster">

<img
src="one_piece.jpg"
alt="One Piece">

</div>

<h3>
One Piece
</h3>

</a>


</div>

</section>


<section class="episodes" id="episodes">

<h2 class="section-title">
أحدث الحلقات
</h2>


<div class="episode-card">

<span>
Demon Slayer — الحلقة 1
</span>

<a href="demon-slayer.html">
مشاهدة
</a>

</div>


<div class="episode-card">

<span>

</span>

<div class="episode-card">

<span>
One Piece
</span>

<a href="one-piece.html">
مشاهدة

</section>

</div>


<footer>

© 2026 KATRO Anime

</footer>


<script>

function searchAnime() {

let input =
document
.getElementById("searchInput")
.value
.toLowerCase();

let cards =
document.querySelectorAll(".anime-card");

cards.forEach(function(card) {

let text =
card.innerText.toLowerCase();

if (text.includes(input)) {

card.style.display = "block";

} else {

card.style.display = "none";

}

});

}

</script>

</body>
    </html>
