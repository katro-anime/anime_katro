
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATRO Anime</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1b2638;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#00b7ff;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

nav{
    display:flex;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#111827;
    padding:9px 14px;
    border-radius:8px;
}

nav a:hover{
    background:#1687d9;
}

.search{
    width:92%;
    max-width:1000px;
    margin:25px auto;
}

.search input{
    width:100%;
    padding:15px;
    border:0;
    outline:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
}

.hero{
    width:92%;
    max-width:1100px;
    margin:20px auto;
    padding:40px 20px;
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:15px;
    text-align:center;
}

.hero h1{
    color:#00b7ff;
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    color:#94a3b8;
}

.container{
    width:92%;
    max-width:1200px;
    margin:30px auto;
}

.title{
    color:#00b7ff;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:18px;
}

.card{
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00b7ff;
}

.card img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
    background:#111827;
}

.card-info{
    padding:12px;
}

.card-info h3{
    font-size:16px;
    margin-bottom:6px;
}

.card-info p{
    color:#94a3b8;
    font-size:13px;
}

/* Social Media */
.social-section{
    margin-top:25px;
    padding:25px 10px;
    border-top:1px solid #1b2638;
}

.social-section h3{
    color:#00b7ff;
    margin-bottom:25px;
}

.social-links{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:45px;
    flex-wrap:wrap;
}

.social-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.social-item:hover{
    transform:translateY(-5px);
}

.social-icon{
    width:55px;
    height:55px;
}

.tiktok-icon{
    fill:white;
}

.youtube-icon{
    fill:#ff0033;
}

.social-name{
    font-size:16px;
    font-weight:bold;
}

.social-url{
    color:#00b7ff;
    font-size:13px;
}

footer{
    text-align:center;
    color:#64748b;
    padding:30px 15px;
}

@media(max-width:600px){
    header{
        flex-direction:column;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card img{
        height:220px;
    }
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">KATRO Anime</a>

<nav>
<a href="index.html">الرئيسية</a>
<a href="index.html">الأنمي</a>
</nav>
</header>

<div class="search">
<input
id="search"
type="text"
placeholder="ابحث عن الأنمي..."
oninput="searchAnime()">
</div>

<section class="hero">

</section>

<div class="container">
<h2 class="title">جميع الأنميات</h2>
<div id="animeGrid" class="grid"></div>
</div>

<footer>

<!-- Social Media Links -->
<div class="social-section">

<h3>تابع KATRO Anime</h3>

<div class="social-links">

<!-- TikTok -->
<a
class="social-item"

target="_blank"
rel="noopener noreferrer">

xmlns="http://www.w3.org/2000/svg">

</svg>

<!-- YouTube -->
<a
class="social-item"

<svg class="social-icon youtube-icon"

</div>

© 2026 KATRO Anime

</footer>

<script src="anime-data.js"></script>

<script>
const grid = document.getElementById("animeGrid");

function slug(name){
    return encodeURIComponent(name);
}

function render(list){
    grid.innerHTML = "";

    list.forEach(name => {
        const anime = getAnime(name);
        if(!anime) return;

        const card = document.createElement("a");
        card.className = "card";
        card.href = "anime.html?name=" + slug(name);

        const img = document.createElement("img");
        img.src = anime.cover;
        img.alt = anime.title;

        img.onerror = function(){
            this.src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
            width="500" height="700">
            <rect width="100%" height="100%"
            fill="#111827"/>
            <text x="50%" y="48%"
            text-anchor="middle"
            fill="#00b7ff"
            font-size="50"
            font-family="Arial">
            KATRO
            </text>
            </svg>
            `);
        };

        const info = document.createElement("div");
        info.className = "card-info";

        info.innerHTML = `
            <h3>${anime.title}</h3>
            <p>${anime.seasons.length} موسم</p>
        `;

        card.appendChild(img);
        card.appendChild(info);
        grid.appendChild(card);
    });
}

function searchAnime(){
    const value = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const result = getAnimeNames().filter(name =>
        name.toLowerCase().includes(value)
    );

    render(result);
}

render(getAnimeNames());
</script>

</body>
</html>
