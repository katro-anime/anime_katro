<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الحلقات | KATRO Anime</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
}

header{
    background:#0d111c;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #1b2638;
}

.logo{
    color:#00b7ff;
    font-size:27px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 15px;
}

.back{
    display:inline-block;
    color:#00b7ff;
    text-decoration:none;
    margin-bottom:20px;
}

.anime-title{
    color:#00b7ff;
    font-size:18px;
    margin-bottom:8px;
}

.season-title{
    font-size:27px;
    margin-bottom:8px;
}

.info{
    color:#9da9bb;
    margin-bottom:25px;
}

.navigation-title{
    font-size:21px;
    margin-bottom:12px;
}

.season-navigation{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:30px;
}

.nav-item{
    flex:0 0 auto;
    text-decoration:none;
    color:white;
    background:#0d111c;
    border:1px solid #1d2a3c;
    border-radius:10px;
    padding:12px 15px;
}

.nav-item.active{
    background:#1687d9;
    border-color:#1687d9;
}

.episodes-title{
    font-size:22px;
    margin-bottom:15px;
}

.episodes{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
}

.episode{
    display:block;
    text-decoration:none;
    text-align:center;
    background:#0d111c;
    color:white;
    border:1px solid #1c2b3d;
    border-radius:10px;
    padding:15px 8px;
    transition:.2s;
}

.episode:hover{
    border-color:#00b7ff;
    transform:translateY(-2px);
}

.movie-box{
    background:#0d111c;
    border:1px solid #1c2b3d;
    border-radius:15px;
    padding:30px;
    text-align:center;
}

.movie-button{
    display:inline-block;
    margin-top:20px;
    background:#1687d9;
    color:white;
    text-decoration:none;
    padding:13px 25px;
    border-radius:9px;
}

.error{
    text-align:center;
    padding:50px 10px;
}

footer{
    text-align:center;
    color:#758195;
    padding:30px 15px;
}

</style>

</head>

<body>

<header>

<div class="logo">
KATRO Anime
</div>

</header>

<div class="container">

<div id="content"></div>

</div>

<footer>
© 2026 KATRO Anime
</footer>

<script src="anime-data.js"></script>

<script>

const params =
new URLSearchParams(window.location.search);

const animeId =
params.get("anime");

const seasonId =
params.get("season");

const anime =
getAnimeById(animeId);

const content =
document.getElementById("content");

if(!anime){

    content.innerHTML = `
        <div class="error">
            <h2>الأنمي غير موجود</h2>
        </div>
    `;

}else{

    const season =
        getSeasonById(anime,seasonId);

    if(!season){

        content.innerHTML = `
            <div class="error">
                <h2>الجزء غير موجود</h2>
            </div>
        `;

    }else{

        document.title =
            season.nameAr +
            " | " +
            anime.titleAr +
            " | KATRO Anime";

        let html = `

            <a
                class="back"
                href="anime.html?anime=${anime.id}"
            >
                ← العودة إلى صفحة الأنمي
            </a>

            <div class="anime-title">
                ${anime.titleAr}
            </div>

            <h1 class="season-title">
                ${season.nameAr}
            </h1>

            <div class="info">
        `;

        if(season.movie){

            html += `
                فيلم
            `;

        }else if(season.episodes > 0){

            html += `
                ${season.episodes} حلقة
            `;

        }else{

            html += `
                قريبًا
            `;

        }

        html += `
            </div>

            <div class="navigation-title">
                الأجزاء والمواسم
            </div>

            <div class="season-navigation">
        `;

        anime.seasons.forEach(otherSeason=>{

            const active =
                otherSeason.id === season.id
                ? "active"
                : "";

            const count =
                otherSeason.movie
                ? "فيلم"
                : otherSeason.episodes > 0
                    ? `${otherSeason.episodes} حلقة`
                    : "قريبًا";

            html += `

                <a
                    class="nav-item ${active}"
                    href="season.html?anime=${anime.id}&season=${otherSeason.id}"
                >
                    ${otherSeason.nameAr}
                    <br>
                    <small>${count}</small>
                </a>

            `;

        });

        html += `
            </div>
        `;


        /* =========================
           فيلم
        ========================= */

        if(season.movie){

            html += `

                <div class="movie-box">

                    <h2>
                        ${season.nameAr}
                    </h2>

                    <p style="margin-top:12px;color:#9da9bb;">
                        هذا الجزء فيلم وليس حلقات تلفزيونية.
                    </p>

                </div>

            `;

        }


        /* =========================
           موسم / حلقات
        ========================= */

        else if(season.episodes > 0){

            html += `

                <div class="episodes-title">
                    الحلقات
                </div>

                <div class="episodes">
            `;

            for(
                let episode = 1;
                episode <= season.episodes;
                episode++
            ){

                let watchAnime =
                    anime.id;

                /*
                 * Solo Leveling
                 * الموسم الثاني يستخدم solo-s2
                 */

                if(
                    anime.id === "solo-leveling" &&
                    season.id === "season-2"
                ){
                    watchAnime = "solo-s2";
                }

                html += `

                    <a
                        class="episode"
                        href="watch.html?anime=${watchAnime}&episode=${episode}"
                    >
                        الحلقة ${episode}
                    </a>

                `;

            }

            html += `
                </div>
            `;

        }


        /* =========================
           لا توجد حلقات بعد
        ========================= */

        else{

            html += `

                <div class="movie-box">

                    <h2>
                        لم تبدأ الحلقات بعد
                    </h2>

                </div>

            `;

        }


        html += `

            `;

        content.innerHTML = html;

    }

}

</script>

</body>

    </html>
