
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATRO Anime - الحلقات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#101725;border-bottom:1px solid #19365c;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#28a9ff;text-decoration:none}
.home{color:white;text-decoration:none;background:#17263b;padding:10px 15px;border-radius:9px}
.container{max-width:1100px;margin:auto;padding:22px 16px}
.hero{display:flex;gap:20px;align-items:center;background:#101725;padding:18px;border-radius:15px;flex-wrap:wrap}
.poster{width:150px;height:200px;object-fit:cover;border-radius:10px}
.info{flex:1;min-width:200px}
h1{color:#38b5ff;margin:0 0 10px}
.info p{color:#aabbd0;line-height:1.7}
h2{color:#38b5ff;margin-top:30px}
.season-list{display:flex;gap:10px;flex-wrap:wrap}
.season-link{background:#17263b;color:white;padding:10px 15px;border-radius:9px;text-decoration:none}
.season-link.active{background:#087fc4}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
.episode{background:#111c2c;border:1px solid #1b3555;border-radius:11px;padding:18px 10px;text-align:center;text-decoration:none;color:white;transition:.2s}
.episode:hover{border-color:#28a9ff;transform:translateY(-3px)}
.number{font-size:25px;color:#38b5ff;font-weight:bold;margin-bottom:8px}
.watch{display:inline-block;background:#087fc4;padding:8px 15px;border-radius:8px;margin-top:8px}
.message{background:#151e2c;padding:16px;border-radius:10px;color:#ffc56b}
footer{text-align:center;padding:25px;color:#8292a8}
</style>
</head>
<body>

<header>
<a class="logo" href="index.html">KATRO Anime</a>
<a class="home" href="index.html">الرئيسية</a>
</header>

<main class="container">
<div id="content">جاري تحميل الحلقات...</div>
</main>

<footer>KATRO Anime</footer>

<script src="anime-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const animeName = params.get("anime") || params.get("name") || "";
const seasonId = params.get("season") || "";
const content = document.getElementById("content");

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function error(message){
 content.innerHTML = `<div class="message">${safe(message)}</div>`;
}

if(typeof getAnime !== "function"){
 error("تعذر تحميل بيانات الأنمي. تأكد من وجود anime-data.js.");
}else{
 const anime = getAnime(animeName);

 if(!anime){
  error("لم يتم العثور على الأنمي. ارجع إلى الرئيسية واختره من جديد.");
 }else{
  const seasons = Array.isArray(anime.seasons) ? anime.seasons : [];
  const season = seasons.find(item => item.id === seasonId);

  if(!season){
   error("لم يتم العثور على هذا الموسم. ارجع إلى صفحة الأنمي واختر الموسم.");
  }else{
   const title = anime.arabic || anime.title || animeName;
   const seasonTitle = season.name || "الموسم";
   const cover = season.cover || anime.cover || "";
   const episodeCount = Math.max(0, Number(season.episodes) || 0);
   const watchAnime = season.watchId || animeName;

   content.innerHTML = `
    <section class="hero">
     <img class="poster" src="${safe(cover)}" alt="${safe(seasonTitle)}"
       onerror="this.style.display='none'">
     <div class="info">
      <h1>${safe(title)}</h1>
      <h3>${safe(seasonTitle)}</h3>
      <p>اختر الحلقة التي تريد مشاهدتها.</p>
      <p>عدد الحلقات: ${episodeCount}</p>
     </div>
    </section>

    <h2>المواسم</h2>
    <div class="season-list" id="seasonList"></div>

    <h2>الحلقات</h2>
    <div class="episodes" id="episodes"></div>
   `;

   const seasonList = document.getElementById("seasonList");

   seasons.forEach(item => {
    const link = document.createElement("a");
    link.className = "season-link" + (item.id === seasonId ? " active" : "");
    link.href = `season.html?anime=${encodeURIComponent(animeName)}&season=${encodeURIComponent(item.id)}`;
    link.textContent = item.name || item.id;
    seasonList.appendChild(link);
   });

   const episodesArea = document.getElementById("episodes");

   if(episodeCount === 0){
    episodesArea.innerHTML = '<div class="message">لم تتم إضافة حلقات هذا الموسم بعد.</div>';
   }else{
    for(let i = 1; i <= episodeCount; i++){
     const link = document.createElement("a");
     link.className = "episode";
     link.href = `watch.html?anime=${encodeURIComponent(watchAnime)}&episode=${i}`;

     link.innerHTML = `
      <div class="number">${i}</div>
      <div>الحلقة ${i}</div>
      <span class="watch">مشاهدة</span>
     `;

     episodesArea.appendChild(link);
    }
   }
  }
 }
}
</script>
</body>
</html>
