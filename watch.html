
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهدة | KATRO Anime</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0
}

body{
 font-family:Arial,sans-serif;
 background:#080b12;
 color:white
}

header{
 background:#0d111c;
 padding:15px 20px;
 border-bottom:1px solid #202738
}

.header-content{
 max-width:1000px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.logo{
 color:#00b7ff;
 font-size:24px;
 font-weight:bold;
 text-decoration:none
}

.home{
 color:white;
 text-decoration:none;
 background:#151c2c;
 padding:8px 15px;
 border-radius:8px
}

.container{
 max-width:1000px;
 margin:auto;
 padding:20px
}

.player{
 background:#000;
 border-radius:15px;
 overflow:hidden;
 margin-bottom:20px
}

.player iframe{
 width:100%;
 height:560px;
 border:0;
 display:block;
 background:#000
}

.episode-info{
 background:#0d111c;
 border-radius:12px;
 padding:18px;
 margin-bottom:20px
}

.episode-info h1{
 font-size:22px;
 margin-bottom:10px;
 color:#38b5ff
}

.episode-info p{
 color:#aeb6c5;
 margin-top:8px;
 line-height:1.7
}

.download-box{
 background:#0d111c;
 border-radius:15px;
 padding:20px;
 margin-bottom:20px
}

.download-button{
 display:block;
 text-align:center;
 background:#1687d9;
 color:white;
 text-decoration:none;
 padding:14px;
 border-radius:9px;
 font-size:16px
}

.download-button:hover{
 background:#00b7ff
}

.servers{
 background:#0d111c;
 border-radius:15px;
 padding:20px
}

.servers h2{
 color:#00b7ff;
 margin-bottom:18px;
 font-size:20px
}

.server-list{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.server{
 border:none;
 background:#1687d9;
 color:white;
 padding:13px;
 border-radius:9px;
 font-size:15px;
 cursor:pointer;
 width:100%
}

.server:hover{
 background:#00b7ff
}

.server.active{
 background:#075e9d;
 outline:2px solid #38b5ff
}

.message{
 background:#151e2c;
 padding:15px;
 border-radius:10px;
 margin-bottom:15px;
 color:#ffc56b;
 line-height:1.7
}

footer{
 text-align:center;
 color:#777;
 padding:30px 10px
}

@media(max-width:600px){
 .container{
  padding:12px
 }

 .player iframe{
  height:230px
 }

 .server-list{
  grid-template-columns:1fr 1fr
 }

 .episode-info h1{
  font-size:20px
 }
}
</style>
</head>

<body>

<header>
<div class="header-content">

<a class="logo" href="index.html">
KATRO Anime
</a>

<a class="home" href="index.html">
الرئيسية
</a>

</div>
</header>

<div class="container">

<div class="player">
<iframe
id="videoPlayer"
src=""
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>
</div>

<div id="message" class="message" style="display:none"></div>

<div class="episode-info">

<h1 id="episodeTitle">جاري تحميل الحلقة...</h1>

<p id="episodeDescription">
إذا لم يعمل الخادم الحالي، جرّب أحد الخوادم الأخرى.
</p>

</div>

<div class="download-box">

<a
id="downloadButton"
class="download-button"
href="#">

⬇ تحميل الحلقة

</a>

</div>

<div class="servers">

<h2>خوادم المشاهدة</h2>

<div class="server-list">

<button class="server" onclick="changeServer(1)">
Mega ▶
</button>

<button class="server" onclick="changeServer(2)">
الخادم 2 ▶
</button>

<button class="server" onclick="changeServer(3)">
الخادم 3 ▶
</button>

<button class="server" onclick="changeServer(4)">
الخادم 4 ▶
</button>

<button class="server" onclick="changeServer(5)">
الخادم 5 ▶
</button>

<button class="server" onclick="changeServer(6)">
الخادم 6 ▶
</button>

</div>
</div>

</div>

<footer>
© 2026 KATRO Anime
</footer>

<script>

/* =================================
   قراءة بيانات الرابط
================================= */

const params = new URLSearchParams(location.search);

const anime = params.get("anime") || "";
const episode = params.get("episode") || "";
const season = params.get("season") || "";
const seasonName = params.get("seasonName") || "";
const sourceAnime = params.get("sourceAnime") || anime;


/* =================================
   العناصر
================================= */

const videoPlayer = document.getElementById("videoPlayer");
const episodeTitle = document.getElementById("episodeTitle");
const episodeDescription = document.getElementById("episodeDescription");
const downloadButton = document.getElementById("downloadButton");
const messageBox = document.getElementById("message");
const serverButtons = document.querySelectorAll(".server");


/* =================================
   عرض بيانات الحلقة
================================= */

episodeTitle.textContent =
 anime + " — " +
 (seasonName ? seasonName + " — " : "") +
 "Episode " + episode;

episodeDescription.textContent =
 "Anime: " + sourceAnime +
 " | Season: " + (seasonName || season || "غير محدد") +
 " | Episode: " + episode;


/* =================================
   روابط المشاهدة الحالية
================================= */

/* Solo Leveling Season 2 Episode 2 */

const filekoshSeason2Episode2 =
"https://filekosh.com/embed/od90zZm5LT";


/* Solo Leveling Season 2 Episode 1 — Mega */

const megaSeason2Episode1 =
"https://mega.nz/file/uF1HSQZQ#GhxjYVU5ELDW03p0oftqHXxLt-G7Z-dPzldP18Tyvw8";


/* =================================
   تحديد روابط الحلقة
================================= */

function getEpisodeLinks(){

 const links = {
  1:"",
  2:"",
  3:"",
  4:"",
  5:"",
  6:""
 };

 /* Solo Leveling Season 2 Episode 1 */

 if(
  (anime === "solo-s2" || sourceAnime === "Solo Leveling") &&
  episode === "1" &&
  (
   season === "solo-leveling-season-2" ||
   seasonName === "Solo Leveling Season 2"
  )
 ){

  links[1] = megaSeason2Episode1;

 }

 /* Solo Leveling Season 2 Episode 2 */

 if(
  (anime === "solo-s2" || sourceAnime === "Solo Leveling") &&
  episode === "2" &&
  (
   season === "solo-leveling-season-2" ||
   seasonName === "Solo Leveling Season 2"
  )
 ){

  links[2] = filekoshSeason2Episode2;

 }

 return links;

}


/* =================================
   الروابط
================================= */

const episodeLinks = getEpisodeLinks();


/* =================================
   تشغيل الخادم
================================= */

function changeServer(serverNumber){

 const link = episodeLinks[serverNumber];

 serverButtons.forEach((button,index)=>{
  button.classList.toggle(
   "active",
   index + 1 === serverNumber
  );
 });

 if(!link){

  messageBox.style.display="block";

  messageBox.textContent =
   "لم تتم إضافة رابط مشاهدة لهذه الحلقة على هذا الخادم حتى الآن.";

  return;

 }

 messageBox.style.display="none";

 if(serverNumber === 1){

  window.open(link,"_blank");

  return;

 }

 videoPlayer.src = link;

}


/* =================================
   تحميل الحلقة
================================= */

downloadButton.href =
"download.html?anime=" +
encodeURIComponent(anime) +
"&episode=" +
encodeURIComponent(episode) +
"&season=" +
encodeURIComponent(season) +
"&seasonName=" +
encodeURIComponent(seasonName);


/* =================================
   تشغيل تلقائي للخادم المتوفر
================================= */

if(episodeLinks[2]){

 changeServer(2);

}else if(episodeLinks[1]){

 changeServer(1);

}else{

 messageBox.style.display="block";

 messageBox.textContent =
 "لم تتم إضافة رابط مشاهدة لهذه الحلقة بعد. يمكنك اختيار خادم آخر عند إضافة روابط إليه.";

}

</script>

</body>
</html>
