<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>مشاهدة الحلقة | KATRO Anime</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

header {
    background: #0d111c;
    padding: 15px 20px;
    border-bottom: 1px solid #202738;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #00b7ff;
    font-size: 24px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    background: #151c2c;
    padding: 8px 15px;
    border-radius: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.video-box {
    background: #0d111c;
    padding: 20px;
    border-radius: 15px;
}

.video-box h1 {
    color: #00b7ff;
    margin-bottom: 20px;
}

video {
    width: 100%;
    max-height: 600px;
    background: black;
    border-radius: 12px;
}

.message {
    margin-top: 15px;
    color: #aeb7c7;
    line-height: 1.7;
}

.back {
    display: inline-block;
    margin-top: 20px;
    background: #1687d9;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}

</style>

</head>


<body>


<header>

<div class="header-content">

<div class="logo">
KATRO Anime
</div>

<a class="home" href="index.html">
الرئيسية
</a>

</div>

</header>



<div class="container">

<section class="video-box">


<h1 id="episodeTitle">
جاري تحميل الحلقة...
</h1>


<video id="videoPlayer" controls>

<source
id="videoSource"
src=""
type="video/mp4">

متصفحك لا يدعم تشغيل الفيديو.

</video>


<p
class="message"
id="message">

صفحة المشاهدة جاهزة.

</p>


<a
class="back"
id="backButton"
href="index.html">

⬅ العودة للحلقات

</a>


</section>

</div>



<footer>

© 2026 KATRO Anime

</footer>



<script>


/* قراءة المعلومات من الرابط */

const params =
new URLSearchParams(
window.location.search
);


const anime =
params.get("anime") || "dragonball";


const episode =
params.get("episode") || "1";



/* أسماء الأنميات */

const animeNames = {

    dragonball:
    "Dragon Ball Super",

    onepiece:
    "One Piece",

    solo:
    "Solo Leveling",

    demonslayer:
    "Demon Slayer"

};



/* إظهار اسم الأنمي ورقم الحلقة */

const animeName =
animeNames[anime] || "KATRO Anime";


document.getElementById(
"episodeTitle"
).textContent =

animeName +
" - الحلقة " +
episode;



/* زر العودة */

const backButton =
document.getElementById(
"backButton"
);


if (anime === "dragonball") {

    backButton.href =
    "dragon-ball.html";

}

else if (anime === "onepiece") {

    backButton.href =
    "one-piece.html";

}

else if (anime === "solo") {

    backButton.href =
    "solo-leveling.html";

}

else if (anime === "demonslayer") {

    backButton.href =
    "demon-slayer.html";

}

else {

    backButton.href =
    "index.html";

}



/* روابط الفيديو */

const videos = {


    dragonball: {

        1: "",
        2: "",
        3: ""

    },


    onepiece: {

        1: "",
        2: "",
        3: ""

    },


    solo: {

        1: "",
        2: "",
        3: ""

    },


    demonslayer: {

        1: "",
        2: "",
        3: ""

    }

};



/* البحث عن فيديو الحلقة */

let videoUrl = "";


if (videos[anime]) {

    videoUrl =
    videos[anime][episode] || "";

}



/* تشغيل الفيديو */

const videoSource =
document.getElementById(
"videoSource"
);


const videoPlayer =
document.getElementById(
"videoPlayer"
);


const message =
document.getElementById(
"message"
);


if (videoUrl !== "") {

    videoSource.src =
    videoUrl;

    videoPlayer.load();

    message.textContent =
    "يمكنك مشاهدة الحلقة الآن.";

}

else {

    message.textContent =
    "لم تتم إضافة رابط الفيديو لهذه الحلقة بعد.";

}


</script>


</body>

    </html>
