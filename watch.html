<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>مشاهدة | KATRO Anime</title><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

header {
    background: #0d111c;
    padding: 15px 20px;
    border-bottom: 1px solid #202738;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #00b7ff;
    font-size: 24px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    background: #151c2c;
    padding: 8px 15px;
    border-radius: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}


/* =========================
   الإعلان
========================= */

.ad-box {
    text-align: center;
    margin-bottom: 20px;
    min-height: 50px;
}


/* =========================
   المشغل
========================= */

.player {
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 20px;
}

.player iframe {
    width: 100%;
    height: 560px;
    border: 0;
    display: block;
    background: #000;
}


/* =========================
   معلومات الحلقة
========================= */

.episode-info {
    background: #0d111c;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.episode-info h1 {
    font-size: 22px;
    margin-bottom: 8px;
}

.episode-info p {
    color: #aeb6c5;
}


/* =========================
   التحميل
========================= */

.download-box {
    background: #0d111c;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.download-button {
    display: block;
    text-align: center;
    background: #1687d9;
    color: white;
    text-decoration: none;
    padding: 14px;
    border-radius: 9px;
    font-size: 16px;
}

.download-button:hover {
    background: #00b7ff;
}


/* =========================
   الخوادم
========================= */

.servers {
    background: #0d111c;
    border-radius: 15px;
    padding: 20px;
}

.servers h2 {
    color: #00b7ff;
    margin-bottom: 18px;
    font-size: 20px;
}

.server-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.server {
    border: none;
    background: #1687d9;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
}

.server:hover {
    background: #00b7ff;
}


/* =========================
   الفوتر
========================= */

footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .player iframe {
        height: 230px;
    }

    .server-list {
        grid-template-columns: 1fr 1fr;
    }

    .episode-info h1 {
        font-size: 20px;
    }

}

</style></head><body><header><div class="header-content"><div class="logo">
KATRO Anime
</div><a class="home" href="index.html">
الرئيسية
</a></div></header><div class="container"><!-- =========================
     الإعلان
========================= --><div class="ad-box"><script async
src="https://js.mbidadm.com/static/scripts.js"
data-admpid="467369">
</script></div><!-- =========================
     مشغل الفيديو
========================= --><div class="player"><iframe
id="videoPlayer"
src=""
allow="autoplay; fullscreen"
allowfullscreen>
</iframe></div><!-- =========================
     معلومات الحلقة
========================= --><div class="episode-info"><h1 id="episodeTitle">
أنت تشاهد الحلقة
</h1><p id="episodeDescription">
إذا لم يعمل الخادم الحالي، جرّب أحد الخوادم الأخرى.
</p></div><!-- =========================
     التحميل
========================= --><div class="download-box"><a
id="downloadButton"
class="download-button"
href="#">

⬇ تحميل الحلقة

</a></div><!-- =========================
     الخوادم
========================= --><div class="servers"><h2>
خوادم المشاهدة
</h2><div class="server-list"><button
class="server"
onclick="changeServer(1)">

Mega ▶

</button><button
class="server"
onclick="changeServer(2)">

الخادم 2 ▶

</button><button
class="server"
onclick="changeServer(3)">

الخادم 3 ▶

</button><button
class="server"
onclick="changeServer(4)">

الخادم 4 ▶

</button><button
class="server"
onclick="changeServer(5)">

الخادم 5 ▶

</button><button
class="server"
onclick="changeServer(6)">

الخادم 6 ▶

</button></div></div></div><footer>© 2026 KATRO Anime

</footer><script>


/* =========================================
   قراءة بيانات الحلقة
========================================= */

const params =
new URLSearchParams(window.location.search);

const anime =
params.get("anime") || "";

const episode =
params.get("episode") || "";



/* =========================================
   عنوان الحلقة
========================================= */

document.getElementById("episodeTitle").textContent =
"أنت تشاهد الحلقة " + episode;



/* =========================================
   روابط المشاهدة
========================================= */

const filekoshSeason2Episode2 =
"https://filekosh.com/embed/od90zZm5LT";



/* =========================================
   تحديد المشغل
========================================= */

const videoPlayer =
document.getElementById("videoPlayer");


/*
   الحلقة 2 من الموسم الثاني
   Solo Leveling
*/

if (
    anime === "solo-s2" &&
    episode === "2"
) {

    videoPlayer.src =
    filekoshSeason2Episode2;

}



/* =========================================
   زر التحميل
========================================= */

document.getElementById("downloadButton").href =
"download.html?anime=" +
encodeURIComponent(anime) +
"&episode=" +
encodeURIComponent(episode);



/* =========================================
   Mega - الحلقة 1 الموسم الثاني
========================================= */

const megaSeason2Episode1 =
"https://mega.nz/file/uF1HSQZQ#GhxjYVU5ELDW03p0oftqHXxLt-G7Z-dPzldP18Tyvw8";



/* =========================================
   تغيير الخادم
========================================= */

function changeServer(serverNumber) {


    /* ================================
       SERVER 1 - MEGA
    ================================= */

    if (serverNumber === 1) {


        if (
            anime === "solo-s2" &&
            episode === "1"
        ) {


            window.open(
                megaSeason2Episode1,
                "_blank"
            );


            return;

        }


        alert(
            "رابط Mega لهذه الحلقة لم تتم إضافته بعد."
        );

        return;

    }



    /* ================================
       باقي الخوادم
    ================================= */

    if (serverNumber >= 2) {

        alert(
            "لم يتم إضافة رابط لهذا الخادم بعد."
        );

        return;

    }

}

</script></body></html>
