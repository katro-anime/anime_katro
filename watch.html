<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>مشاهدة | KATRO Anime</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

header {
    background: #0d111c;
    padding: 15px 20px;
    border-bottom: 1px solid #202738;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #00b7ff;
    font-size: 24px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    background: #151c2c;
    padding: 8px 15px;
    border-radius: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}


/* =========================
   المشغل
========================= */

.player {
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 20px;
}

video {
    width: 100%;
    height: auto;
    display: block;
    background: #000;
}


/* =========================
   معلومات الحلقة
========================= */

.episode-info {
    background: #0d111c;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.episode-info h1 {
    font-size: 22px;
    margin-bottom: 8px;
}

.episode-info p {
    color: #aeb6c5;
}


/* =========================
   الخوادم
========================= */

.servers {
    background: #0d111c;
    border-radius: 15px;
    padding: 20px;
}

.servers h2 {
    color: #00b7ff;
    margin-bottom: 18px;
    font-size: 20px;
}

.server-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.server {
    border: none;
    background: #1687d9;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
}

.server:hover {
    background: #00b7ff;
}

.server.active {
    background: #00b7ff;
}


/* =========================
   الفوتر
========================= */

footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .server-list {
        grid-template-columns: 1fr 1fr;
    }

    .episode-info h1 {
        font-size: 20px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-content">

<div class="logo">
KATRO Anime
</div>

<a class="home" href="index.html">
الرئيسية
</a>

</div>

</header>



<div class="container">


<!-- =========================
     مشغل الفيديو
========================= -->

<div class="player">

<video
id="videoPlayer"
controls
poster="Solo leveling .jpg">

<source
id="videoSource"
src=""
type="video/mp4">

متصفحك لا يدعم تشغيل الفيديو.

</video>

</div>



<!-- =========================
     معلومات الحلقة
========================= -->

<div class="episode-info">

<h1 id="episodeTitle">
أنت تشاهد الحلقة
</h1>

<p id="episodeDescription">
إذا لم يعمل الخادم الحالي، جرّب أحد الخوادم الأخرى.
</p>

</div>



<!-- =========================
     الخوادم
========================= -->

<div class="servers">

<h2>
خوادم المشاهدة
</h2>


<div class="server-list">


<!-- =========================
     SERVER 1 - MEGA
========================= -->

<button
class="server"
id="megaServer"
onclick="changeServer(1)">

Mega ▶

</button>



<!-- =========================
     SERVER 2
========================= -->

<button
class="server"
onclick="changeServer(2)">

الخادم 2 ▶

</button>



<!-- =========================
     SERVER 3
========================= -->

<button
class="server"
onclick="changeServer(3)">

الخادم 3 ▶

</button>



<!-- =========================
     SERVER 4
========================= -->

<button
class="server"
onclick="changeServer(4)">

الخادم 4 ▶

</button>



<!-- =========================
     SERVER 5
========================= -->

<button
class="server"
onclick="changeServer(5)">

الخادم 5 ▶

</button>



<!-- =========================
     SERVER 6
========================= -->

<button
class="server"
onclick="changeServer(6)">

الخادم 6 ▶

</button>


</div>

</div>

</div>



<footer>

© 2026 KATRO Anime

</footer>



<script>


/* =========================================
   قراءة بيانات الحلقة من الرابط
========================================= */

const params =
new URLSearchParams(window.location.search);


const anime =
params.get("anime") || "";


const episode =
params.get("episode") || "";



/* =========================================
   عرض رقم الحلقة
========================================= */

document.getElementById("episodeTitle").textContent =
"أنت تشاهد الحلقة " + episode;



/* =========================================
   رابط Mega الحالي
========================================= */

const megaSeason2Episode1 =
"https://mega.nz/file/uF1HSQZQ#GhxjYVU5ELDW03p0oftqHXxLt-G7Z-dPzldP18Tyvw8";



/* =========================================
   تغيير الخادم
========================================= */

function changeServer(serverNumber) {


    /* =====================================
       الخادم 1 = Mega
       
       الزر ظاهر دائمًا
       
       لكن الرابط يعمل فقط:
       
       Solo Leveling
       الموسم الثاني
       الحلقة 1
    ===================================== */

    if (serverNumber === 1) {


        if (
            anime === "solo-s2" &&
            episode === "1"
        ) {


            window.open(
                megaSeason2Episode1,
                "_blank"
            );


            return;

        }


        /* باقي الأنميات والحلقات */

        alert(
            "رابط Mega لهذه الحلقة لم تتم إضافته بعد."
        );


        return;
    }



    /* =====================================
       الخوادم الأخرى
    ===================================== */

    if (serverNumber >= 2) {

        alert(
            "لم يتم إضافة رابط لهذا الخادم بعد."
        );

        return;

    }

}

</script>


</body>

    </html>
