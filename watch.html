<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشاهدة الحلقة | KATRO Anime</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

header {
    background: #0d111c;
    padding: 15px 20px;
    border-bottom: 1px solid #202738;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #00b7ff;
    font-size: 24px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    background: #151c2c;
    padding: 8px 15px;
    border-radius: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.video-box {
    background: #0d111c;
    padding: 20px;
    border-radius: 15px;
}

.video-box h1 {
    color: #00b7ff;
    margin-bottom: 20px;
}

video {
    width: 100%;
    max-height: 600px;
    background: black;
    border-radius: 12px;
}

.back {
    display: inline-block;
    margin-top: 20px;
    background: #1687d9;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}
</style>

</head>

<body>

<header>

<div class="header-content">

<div class="logo">
KATRO Anime
</div>

<a class="home" href="index.html">
الرئيسية
</a>

</div>

</header>


<div class="container">

<section class="video-box">

<h1 id="episodeTitle">
Dragon Ball Super - الحلقة
</h1>


<video controls id="videoPlayer">

<source id="videoSource" src="" type="video/mp4">

متصفحك لا يدعم تشغيل الفيديو.

</video>


<a class="back" href="dragon-ball.html">
⬅ العودة إلى الحلقات
</a>

</section>

</div>


<footer>
© 2026 KATRO Anime
</footer>


<script>

const params = new URLSearchParams(window.location.search);

const episode = params.get("episode") || "1";


document.getElementById("episodeTitle").textContent =
"Dragon Ball Super - الحلقة " + episode;


/*
ضع رابط فيديو الحلقة هنا عندما يكون لديك
رابط مباشر لملف الفيديو.
*/

const videos = {

    1: "",
    2: "",
    3: "",
    4: "",
    5: ""

};


const videoSource = document.getElementById("videoSource");

if (videos[episode]) {

    videoSource.src = videos[episode];

    document.getElementById("videoPlayer").load();

}

</script>

</body>
