<!DOCTYPE html>

    .header {

    }

    .container {

    }

      color: #bbb;

    }

      margin: 25px 0 15px;
      border-right: 4px solid #e50914;
      padding-right: 10px;
    }

    .season {
      background: #141720;
      border: 1px solid #252936;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .season h2 {
      margin-top: 0;
    }

    .episode {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #1b1e27;
      padding: 14px;
      border-radius: 9px;
      margin-top: 10px;
    }

    .episode-info h3 {
      margin: 0 0 5px;
    }

    .episode-info p {
      margin: 0;
      color: #888;
      font-size: 13px;
    }

    .watch {
      background: #e50914;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      white-space: nowrap;
    }

    footer {
      margin-top: 40px;
      padding: 30px;
      text-align: center;
      color: #777;
      background: #11141c;
    }

    @media (max-width: 600px) {
      .header {
        gap: 10px;
      }

      .anime-header h1 {
        font-size: 25px;
      }

      .episode {

        flex-direction: column;
      }

      .watch {
