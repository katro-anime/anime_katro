nav a{

nav a:hover{

.container{
    max-width:1100px;

    padding:25px 20px;

/* معلومات الأنمي */

.anime-details{
    background:#0d111c;
    border-radius:18px;
    padding:25px;
    display:flex;
    gap:25px;
    margin-bottom:30px;
}

.anime-poster{
    width:220px;
    height:310px;
    flex-shrink:0;
    border-radius:14px;
    overflow:hidden;
    background:#121827;
}

.anime-poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.anime-text{
    padding-top:10px;
}

.anime-text h1{
    color:#00b7ff;
    margin-bottom:18px;
}

.anime-text p{
    color:#b9c0ce;
    line-height:1.8;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    background:#121827;
    color:#00b7ff;
    padding:8px 12px;
    border-radius:8px;
    margin-top:10px;
}


/* المواسم */

.section-title{
    color:#00b7ff;
    margin-bottom:18px;
}

.season{
    background:#0d111c;
    border-radius:14px;
    padding:20px;
    margin-bottom:25px;
}

.season-title{
    font-size:20px;
    margin-bottom:15px;
}


/* الحلقات */

.episodes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.episode{
    background:#121827;
    border-radius:9px;
    padding:12px;
    text-align:center;
}

.episode-number{
    margin-bottom:10px;
    color:white;
}

.watch-btn{
    display:block;
    background:#1687d9;
    color:white;
    text-decoration:none;
    padding:8px;
    border-radius:7px;
}

.watch-btn:hover{
    background:#00b7ff;
}


/* رسالة */

.message{
    background:#0d111c;
    border-radius:14px;
    padding:25px;
    text-align:center;
    color:#b9c0ce;
    margin-top:20px;
}


/* زر الرجوع */

.back{
    display:inline-block;
    background:#1687d9;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    margin-bottom:20px;
}

.back:hover{
    background:#00b7ff;
}


footer{
    text-align:center;
    color:#777;
    padding:35px 10px;
    margin-top:30px;
}


/* الهاتف */

@media(max-width:700px){

    .header-content{
        flex-direction:column;
        gap:12px;
    }

    .anime-details{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .anime-poster{
        width:200px;
        height:280px;
    }

    .episodes{
        grid-template-columns:repeat(2,1fr);
    }

}

    image.alt =

    image.onerror =
    function(){

        defaultImage;

    /*

    إنشاء الموسم الأول
    =======================================
    */

    createSeason(anime);

}


/*
===========================================
إنشاء الحلقات
===========================================
*/

function createSeason(anime){

    const seasons =
    document.getElementById("seasons");


    /*
    إذا كان عدد الحلقات غير رقمي
    */

    let count =
    parseInt(anime.episodes);


    if(isNaN(count)){

        seasons.innerHTML = `

        <div class="season">

            <div class="season-title">
                الموسم الأول
            </div>

            <div class="message">

                حلقات هذا الأنمي لم تتم إضافتها
                إلى KATRO Anime بعد.

                <br><br>

                سيتم إضافة روابط المشاهدة
                والتحميل عند تجهيز الحلقات.

            </div>

        </div>

        `;

        return;

    }


    /*
    لا ننشئ آلاف البطاقات
    للأنميات الطويلة جدًا.
    */

    if(count > 500){

        count = 500;

    }


    let html = `

    <div class="season">

        <div class="season-title">
            الموسم الأول
        </div>

        <div class="episodes">
    `;


    for(
        let i = 1;
        i <= count;
        i++
    ){

        html += `

        <div class="episode">

            <div class="episode-number">

                الحلقة ${i}

            </div>

            <a
            href="#"
            class="watch-btn"
            onclick="episodeMessage(event)">

            قريبًا

            </a>

        </div>

        `;

    }


    html += `

        </div>

    </div>

    `;


    seasons.innerHTML =
    html;

}


/*
===========================================
زر الحلقة
===========================================
*/

function episodeMessage(event){

    event.preventDefault();

    alert(
        "رابط مشاهدة هذه الحلقة لم تتم إضافته بعد."
    );

}
