*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1b2638;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#00b7ff;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

nav a{
    color:#fff;
    text-decoration:none;
    background:#111827;
    padding:9px 14px;
    border-radius:8px;
    font-size:14px;
}

nav a:hover{
    background:#1687d9;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

.back{
    display:inline-block;
    background:#1687d9;
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    margin-bottom:20px;
}

.anime-box{
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:15px;
    padding:20px;
}

.anime-main{
    display:flex;
    gap:25px;
    align-items:flex-start;
}

.main-cover{
    width:220px;
    height:310px;
    object-fit:cover;
    border-radius:12px;
    background:#111827;
    flex-shrink:0;
}

.anime-info{
    flex:1;
}

.anime-info h1{
    color:#00b7ff;
    font-size:30px;
    margin-bottom:15px;
}

.anime-info p{
    color:#cbd5e1;
    line-height:1.9;
    margin-bottom:10px;
}

.info-line{
    background:#111827;
    border-radius:8px;
    padding:10px 13px;
    margin-top:8px;
}

.info-line strong{
    color:#00b7ff;
}

.section-title{
    margin:35px 0 18px;
    font-size:24px;
    color:#00b7ff;
}

.seasons{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.season-card{
    background:#111827;
    border:2px solid transparent;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.season-card:hover{
    transform:translateY(-4px);
    border-color:#1687d9;
}

.season-card.active{
    border-color:#00b7ff;
}

.season-card img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
}

.season-content{
    padding:12px;
}

.season-content h3{
    font-size:17px;
    margin-bottom:7px;
}

.season-content p{
    color:#94a3b8;
    font-size:14px;
}

.episodes-box{
    margin-top:30px;
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:15px;
    padding:20px;
}

.episodes-title{
    color:#00b7ff;
    font-size:23px;
    margin-bottom:18px;
}

.episodes{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:10px;
}

.episode{
    background:#1687d9;
    color:#fff;
    text-decoration:none;
    padding:13px 8px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
    transition:.2s;
}

.episode:hover{
    background:#00b7ff;
    transform:translateY(-2px);
}

.no-data{
    text-align:center;
    padding:50px 20px;
    color:#94a3b8;
}

footer{
    text-align:center;
    color:#64748b;
    padding:40px 15px 25px;
    margin-top:30px;
}

@media(max-width:700px){

    header{
        flex-direction:column;
    }

    .anime-main{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .main-cover{
        width:190px;
        height:270px;
    }

    .anime-info{
        width:100%;
    }

    .anime-info h1{
        font-size:25px;
    }

    .seasons{
        grid-template-columns:repeat(2,1fr);
    }

    .season-card img{
        height:220px;
    }

    .episodes{
        grid-template-columns:repeat(2,1fr);
    }
}

/* =========================================================
   البحث عن اسم الأنمي
========================================================= */

const params = new URLSearchParams(window.location.search);

const requestedName = params.get("name") || "";

let anime = animeDatabase[requestedName];

if(!anime){

    const key = Object.keys(animeDatabase).find(name =>
        name.toLowerCase() === requestedName.toLowerCase()
    );

    if(key){
        anime = animeDatabase[key];
    }
}


/* =========================================================
   إنشاء الصفحة
========================================================= */

const container = document.getElementById("animeContainer");


if(!anime){

    container.innerHTML = `
        <div class="anime-box no-data">
            <h2>الأنمي غير موجود</h2>
            <p style="margin-top:10px;">
                لم يتم العثور على هذا الأنمي في قاعدة بيانات KATRO Anime.
            </p>

            <a href="index.html"
               class="back"
               style="margin-top:20px;">
               العودة للرئيسية
            </a>
        </div>
    `;

}else{

    document.title = anime.title + " | KATRO Anime";

    container.innerHTML = `

        <div class="anime-box">

            <div class="anime-main">

                <img
                    class="main-cover"
                    src="${anime.cover}"
                    onerror="this.src=defaultCover"
                    alt="${anime.title}"
                >

                <div class="anime-info">

                    <h1>${anime.title}</h1>

                    <p>
                        ${anime.arabic}
                    </p>

                    <p>
                        ${anime.description}
                    </p>

                    <div class="info-line">
                        <strong>عدد المواسم:</strong>
                        ${anime.seasons.length}
                    </div>

                    <div class="info-line">
                        <strong>الموقع:</strong>
                        KATRO Anime
                    </div>

                </div>

            </div>


            <h2 class="section-title">
                المواسم
            </h2>

            <div class="seasons" id="seasons"></div>

        </div>


        <div class="episodes-box">

            <h2 class="episodes-title" id="episodesTitle">
                الحلقات
            </h2>

            <div class="episodes" id="episodes"></div>

        </div>
    `;


    const seasonsContainer =
        document.getElementById("seasons");

    const episodesContainer =
        document.getElementById("episodes");

    const episodesTitle =
        document.getElementById("episodesTitle");


    /* =====================================================
       إنشاء بطاقات المواسم
    ===================================================== */

    anime.seasons.forEach((season,index)=>{

        const card = document.createElement("div");

        card.className =
            "season-card" +
            (index === 0 ? " active" : "");

        card.innerHTML = `

            <img
                src="${season.cover}"
                onerror="this.src=defaultCover"
                alt="${season.name}"
            >

            <div class="season-content">

                <h3>
                    ${season.name}
                </h3>

                <p>
                    ${season.episodes} حلقة
                </p>

            </div>
        `;


        card.onclick = ()=>{

            document
                .querySelectorAll(".season-card")
                .forEach(c =>
                    c.classList.remove("active")
                );

            card.classList.add("active");

            showEpisodes(season);
        };


        seasonsContainer.appendChild(card);

    });


    /* =====================================================
       عرض الحلقات
    ===================================================== */

    function showEpisodes(season){

        episodesContainer.innerHTML = "";

        episodesTitle.textContent =
            season.name +
            " — " +
            season.episodes +
            " حلقة";


        for(let i=1;i<=season.episodes;i++){

            const episode = document.createElement("a");

            episode.className = "episode";

            episode.href =
                "watch.html?anime=" +
                encodeURIComponent(season.watchId) +
                "&episode=" +
                i;

            episode.textContent =
                "الحلقة " + i;

            episodesContainer.appendChild(episode);
        }

    }


    /* أول موسم تلقائيًا */

    if(anime.seasons.length > 0){
        showEpisodes(anime.seasons[0]);
    }

}
