<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الأنمي | KATRO Anime</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1b2638;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#00b7ff;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

nav{
    display:flex;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#111827;
    padding:9px 14px;
    border-radius:8px;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

.back{
    display:inline-block;
    color:white;
    background:#1687d9;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    margin-bottom:20px;
}

.info{
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:15px;
    padding:20px;
    display:flex;
    gap:25px;
}

.main-cover{
    width:220px;
    height:310px;
    object-fit:cover;
    border-radius:12px;
    background:#111827;
}

.details{
    flex:1;
}

.details h1{
    color:#00b7ff;
    font-size:30px;
    margin-bottom:10px;
}

.details p{
    color:#cbd5e1;
    line-height:1.9;
}

.status{
    display:inline-block;
    margin-top:15px;
    background:#1687d9;
    padding:8px 13px;
    border-radius:8px;
}

.section-title{
    color:#00b7ff;
    margin:30px 0 18px;
}

.seasons{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.season{
    background:#0d111c;
    border:1px solid #1b2638;
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.season:hover{
    transform:translateY(-5px);
    border-color:#00b7ff;
}

.season img{
    width:100%;
    height:250px;
    object-fit:cover;
    background:#111827;
}

.season-info{
    padding:12px;
}

.season-info h3{
    margin-bottom:7px;
}

.season-info p{
    color:#94a3b8;
    font-size:14px;
}

.error{
    text-align:center;
    background:#0d111c;
    border:1px solid #1b2638;
    padding:50px 20px;
    border-radius:15px;
}

footer{
    text-align:center;
    color:#64748b;
    padding:40px;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:12px;
    }

    .info{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .main-cover{
        width:190px;
        height:270px;
    }

    .seasons{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .season img{
        height:220px;
    }

}

</style></head><body><header><a href="index.html"
class="logo">
KATRO Anime
</a>

<nav><a href="index.html">
الرئيسية
</a></nav></header><div class="container"><a href="index.html"
class="back">
← العودة للرئيسية
</a>

<div id="page"></div></div><footer>
© 2026 KATRO Anime
</footer><script src="anime-data.js"></script><script>

const params =
new URLSearchParams(
window.location.search
);

const name =
params.get("name");

const anime =
getAnime(name);

const page =
document.getElementById("page");


if(!anime){

    page.innerHTML = `

        <div class="error">

            <h2>
            الأنمي غير موجود
            </h2>

            <p style="margin-top:12px;color:#94a3b8;">
            لم يتم العثور على هذا الأنمي.
            </p>

        </div>

    `;

}else{

    document.title =
    anime.title +
    " | KATRO Anime";


    let seasonsHTML = "";


    anime.seasons.forEach(season => {

        seasonsHTML += `

            <a class="season"
               href="season.html?anime=${encodeURIComponent(name)}&season=${encodeURIComponent(season.id)}">

                <img
                    src="${season.cover}"
                    alt="${season.name}"
                    onerror="this.src=anime.cover"
                >

                <div class="season-info">

                    <h3>
                    ${season.name}
                    </h3>

                    <p>
                    ${season.episodes} حلقة
                    </p>

                </div>

            </a>

        `;

    });


    page.innerHTML = `

        <div class="info">

            <img
                class="main-cover"
                src="${anime.cover}"
                alt="${anime.title}"
                onerror="this.src='${anime.cover}'"
            >

            <div class="details">

                <h1>
                ${anime.title}
                </h1>

                <p>
                ${anime.arabic}
                </p>

                <p style="margin-top:12px;">
                اختر الموسم الذي تريد مشاهدته.
                </p>

                <div class="status">

                ${anime.seasons.length}
                مواسم

                ${
                    anime.ongoing
                    ? " • مستمر"
                    : ""
                }

                </div>

                ${
                    anime.totalEpisodes
                    ? `
                    <div class="status">
                    ${anime.totalEpisodes} حلقة
                    </div>
                    `
                    : ""
                }

            </div>

        </div>


        <h2 class="section-title">
        المواسم
        </h2>

        <div class="seasons">

        ${seasonsHTML}

        </div>

    `;

}

</script></body></html>
