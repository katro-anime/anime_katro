<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الأنمي | KATRO Anime</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
}

header{
    background:#0d111c;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #1b2638;
}

.logo{
    color:#00b7ff;
    font-size:27px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.anime-info{
    background:#0d111c;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.anime-cover{
    width:220px;
    max-width:100%;
    border-radius:12px;
    margin-bottom:15px;
}

.anime-title{
    font-size:27px;
    margin-bottom:8px;
}

.anime-status{
    color:#00b7ff;
    margin-bottom:20px;
}

.section-title{
    margin:30px 0 15px;
    font-size:23px;
}

.seasons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.season-card{
    display:block;
    text-decoration:none;
    color:white;
    background:#0d111c;
    border:1px solid #1c2b3d;
    border-radius:14px;
    padding:20px;
    transition:.2s;
}

.season-card:hover{
    border-color:#00b7ff;
    transform:translateY(-3px);
}

.season-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.season-count{
    color:#aab5c5;
}

.movie{
    color:#ffcc00;
}

footer{
    text-align:center;
    color:#758195;
    padding:30px 15px;
}

.error{
    text-align:center;
    padding:50px 10px;
}

</style>

</head>

<body>

<header>

<div class="logo">
KATRO Anime
</div>

</header>

<div class="container">

<div id="content"></div>

</div>

<footer>
© 2026 KATRO Anime
</footer>

<script src="anime-data.js"></script>

<script>

const params =
new URLSearchParams(window.location.search);

const animeId =
params.get("anime");

const anime =
getAnimeById(animeId);

const content =
document.getElementById("content");

if(!anime){

    content.innerHTML = `
        <div class="error">
            <h2>الأنمي غير موجود</h2>
            <p>تأكد من الرابط.</p>
        </div>
    `;

}else{

    document.title =
        anime.titleAr + " | KATRO Anime";

    let html = `

        <div class="anime-info">

            <img
                class="anime-cover"
                src="${anime.cover}"
                alt="${anime.titleAr}"
                onerror="this.style.display='none'"
            >

            <div class="anime-title">
                ${anime.titleAr}
            </div>

            <div class="anime-status">
                ${anime.status}
            </div>

        </div>

        <h2 class="section-title">
            المواسم والأجزاء
        </h2>

        <div class="seasons">
    `;

    anime.seasons.forEach((season,index)=>{

        const movieClass =
            season.movie ? "movie" : "";

        const countText =
            season.movie
            ? "فيلم"
            : season.episodes > 0
                ? `${season.episodes} حلقة`
                : "قريبًا";

        html += `

            <a
                class="season-card"
                href="season.html?anime=${anime.id}&season=${season.id}"
            >

                <div class="season-name ${movieClass}">
                    ${season.nameAr}
                </div>

                <div class="season-count">
                    ${countText}
                </div>

            </a>

        `;

    });

    html += `
        </div>
    `;

    content.innerHTML = html;
}

</script>

</body>

</html>
