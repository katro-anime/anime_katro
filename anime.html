
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATRO Anime</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080b12;
 color:#fff;
 font-family:Arial,sans-serif
}

header{
 padding:18px 5%;
 background:#101725;
 border-bottom:1px solid #19365c;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px
}

.logo{
 font-size:25px;
 font-weight:bold;
 color:#28a9ff;
 text-decoration:none
}

.home{
 color:#fff;
 text-decoration:none;
 background:#17263b;
 padding:10px 15px;
 border-radius:9px
}

.container{
 max-width:1100px;
 margin:auto;
 padding:25px 16px
}

.hero{
 display:flex;
 gap:25px;
 align-items:center;
 flex-wrap:wrap;
 background:#101725;
 padding:20px;
 border-radius:16px
}

.poster{
 width:220px;
 height:310px;
 object-fit:cover;
 border-radius:12px;
 background:#17263b
}

.info{
 flex:1;
 min-width:220px
}

h1{
 font-size:30px;
 margin:0 0 10px;
 color:#38b5ff
}

.english{
 color:#aabbd0;
 font-size:17px
}

.description{
 color:#c4d0df;
 line-height:1.8
}

.meta{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:15px
}

.tag{
 background:#1b2b42;
 padding:8px 12px;
 border-radius:8px;
 color:#bfe5ff
}

h2{
 margin-top:35px;
 color:#38b5ff
}

.seasons{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:15px
}

.season{
 background:#111c2c;
 border:1px solid #1b3555;
 border-radius:12px;
 overflow:hidden;
 text-decoration:none;
 color:white;
 transition:.2s
}

.season:hover{
 transform:translateY(-4px);
 border-color:#28a9ff
}

.season img{
 width:100%;
 height:220px;
 object-fit:cover;
 background:#17263b;
 display:block
}

.season-placeholder{
 height:220px;
 background:linear-gradient(145deg,#101b2b,#152e4b 55%,#07101c);
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:15px;
 color:#38b5ff;
 font-weight:bold;
 font-size:20px
}

.season-placeholder span{
 display:block;
 opacity:.65;
 font-size:12px;
 margin-top:8px;
 color:#aabbd0
}

.season-info{
 padding:13px
}

.season-info h3{
 margin:0 0 8px
}

.season-info p{
 margin:0;
 color:#aabbd0;
 font-size:14px
}

.empty{
 background:#151e2c;
 padding:18px;
 border-radius:10px;
 color:#ffc56b
}

footer{
 text-align:center;
 padding:25px;
 color:#8292a8
}

.social{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin-top:15px
}

.social a{
 color:#38b5ff;
 text-decoration:none
}

@media(max-width:600px){
 .poster{
  width:160px;
  height:230px
 }
 .season img,.season-placeholder{
  height:200px
 }
}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">KATRO Anime</a>
<a class="home" href="index.html">الرئيسية</a>
</header>

<main class="container">
<div id="content">جاري تحميل الأنمي...</div>
</main>

<footer>
KATRO Anime
<div class="social">
<a href="https://www.tiktok.com/@katro10k" target="_blank" rel="noopener">TikTok</a>
<a href="https://youtube.com/@katro10k" target="_blank" rel="noopener">YouTube</a>
</div>
</footer>

<script src="anime-data.js"></script>
<script src="season-data.js"></script>

<script>
"use strict";

/* ================================
   PAGE INITIALIZATION
================================ */

const params = new URLSearchParams(location.search);
const animeName = params.get("name") || params.get("anime") || "";
const content = document.getElementById("content");

const COVER_CACHE_KEY = "KATRO_SEASON_COVERS_V2";
const ANILIST_API = "https://graphql.anilist.co";

/* ================================
   HELPERS
================================ */

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function slug(text){
 return String(text || "")
  .toLowerCase()
  .trim()
  .replace(/[^a-z0-9]+/g,"-")
  .replace(/^-|-$/g,"");
}

function normalize(text){
 return String(text || "")
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]/g,"");
}

function showError(message){
 content.innerHTML = `<div class="empty">${safe(message)}</div>`;
}

function createPlaceholder(title){
 const div = document.createElement("div");
 div.className = "season-placeholder";

 const inner = document.createElement("div");
 inner.textContent = title;

 const brand = document.createElement("span");
 brand.textContent = "KATRO Anime";

 inner.appendChild(brand);
 div.appendChild(inner);

 return div;
}

/* ================================
   SEASON DATA
================================ */

function getSeasonsForAnime(name,anime){

 const databaseSeasons =
  window.getAnimeSeasons
   ? window.getAnimeSeasons(name)
   : [];

 if(databaseSeasons.length){

  return databaseSeasons.map((item,index)=>({

   id:item.id || slug(item.name || `Season ${index+1}`),

   name:item.name || `Season ${index+1}`,

   episodes:Number(item.episodes) || 0,

   search:item.search || item.name || "",

   cover:item.cover || "",

   watchId:item.watchId || name

  }));

 }

 /* Fallback to old data if new database is unavailable */

 return Array.isArray(anime.seasons)
  ? anime.seasons
  : [];
}

/* ================================
   CACHE
================================ */

function readCoverCache(){
 try{
  return JSON.parse(localStorage.getItem(COVER_CACHE_KEY) || "{}");
 }catch(e){
  return {};
 }
}

function saveCoverCache(cache){
 try{
  localStorage.setItem(COVER_CACHE_KEY,JSON.stringify(cache));
 }catch(e){}
}

/* ================================
   ANILIST SEASON COVER
================================ */

async function getSeasonCover(search){

 if(!search) return "";

 const cache = readCoverCache();

 if(cache[search]){
  return cache[search];
 }

 try{

  const query = `
   query {
    Page(perPage: 10) {
     media(
      search: ${JSON.stringify(search)}
      type: ANIME
      sort: SEARCH_MATCH
      isAdult: false
     ) {
      title {
       english
       romaji
       native
      }
      coverImage {
       extraLarge
       large
      }
     }
    }
   }
  `;

  const response = await fetch(ANILIST_API,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
   },
   body:JSON.stringify({query})
  });

  if(!response.ok){
   return "";
  }

  const json = await response.json();

  const list = json?.data?.Page?.media || [];

  if(!list.length){
   return "";
  }

  const wanted = normalize(search);

  /* Try exact title match first */

  const exact = list.find(item=>{

   const titles = [
    item.title?.english,
    item.title?.romaji,
    item.title?.native
   ].filter(Boolean);

   return titles.some(title=>normalize(title) === wanted);

  });

  /* Otherwise use AniList's best search result */

  const chosen = exact || list[0];

  const cover =
   chosen?.coverImage?.extraLarge ||
   chosen?.coverImage?.large ||
   "";

  if(cover){

   cache[search] = cover;
   saveCoverCache(cache);

  }

  return cover;

 }catch(error){

  console.warn("KATRO season cover error:",search,error);
  return "";

 }
}

/* ================================
   SEASON CARD
================================ */

function createSeasonCard(season,index,animeName){

 const card = document.createElement("a");
 card.className = "season";

 card.href =
  `season.html?anime=${encodeURIComponent(animeName)}&season=${encodeURIComponent(season.id || "")}`;

 const title = season.name || `Season ${index+1}`;

 const visual = createPlaceholder(title);
 card.appendChild(visual);

 const info = document.createElement("div");
 info.className = "season-info";

 const heading = document.createElement("h3");
 heading.textContent = title;

 const episodeText = document.createElement("p");
 episodeText.textContent = `${Number(season.episodes)||0} Episodes`;

 info.appendChild(heading);
 info.appendChild(episodeText);
 card.appendChild(info);

 /* Use season cover only, never the main anime cover */

 if(season.cover){

  const img = document.createElement("img");
  img.src = season.cover;
  img.alt = title;

  img.onerror = ()=>{
   img.replaceWith(createPlaceholder(title));
  };

  visual.replaceWith(img);

 }else{

  getSeasonCover(season.search || title).then(cover=>{

   if(!cover || !card.isConnected) return;

   const img = document.createElement("img");
   img.src = cover;
   img.alt = title;

   img.onerror = ()=>{
    img.replaceWith(createPlaceholder(title));
   };

   const placeholder = card.querySelector(".season-placeholder");

   if(placeholder){
    placeholder.replaceWith(img);
   }

  });

 }

 return card;
}

/* ================================
   RENDER PAGE
================================ */

function renderAnimePage(){

 if(typeof getAnime !== "function"){
  showError("لم يتم تحميل anime-data.js");
  return;
 }

 const anime = getAnime(animeName);

 if(!anime){
  showError("لم يتم العثور على الأنمي.");
  return;
 }

 const title = anime.arabic || anime.title || animeName;
 const seasons = getSeasonsForAnime(animeName,anime);

 content.innerHTML = `
  <section class="hero">

   <img class="poster" id="mainPoster"
    src="${safe(anime.cover || "")}"
    alt="${safe(title)}">

   <div class="info">

    <h1>${safe(title)}</h1>

    <div class="english">
     ${safe(anime.title || animeName)}
    </div>

    <p class="description">
     شاهد المواسم والأجزاء على KATRO Anime.
    </p>

    <div class="meta">

     <span class="tag">
      المواسم: ${seasons.length}
     </span>

     ${anime.ongoing
      ? '<span class="tag">مستمر</span>'
      : ''}

     ${anime.totalEpisodes
      ? `<span class="tag">الحلقات: ${safe(anime.totalEpisodes)}</span>`
      : ''}

    </div>

   </div>
  </section>

  <h2>المواسم والأجزاء</h2>

  <section class="seasons" id="seasons"></section>
 `;

 const mainPoster = document.getElementById("mainPoster");

 mainPoster.onerror = ()=>{
  mainPoster.style.display="none";
 };

 /* Update main cover when AniList database finishes */

 document.addEventListener("KATRO_DATA_UPDATED",function(){

  const updated = getAnime(animeName);

  if(updated && updated.cover){
   mainPoster.src = updated.cover;
   mainPoster.style.display="";
  }

 });

 const seasonArea = document.getElementById("seasons");

 if(!seasons.length){

  seasonArea.innerHTML =
   '<div class="empty">لا توجد مواسم مسجلة لهذا الأنمي حتى الآن.</div>';

  return;

 }

 seasons.forEach((season,index)=>{

  seasonArea.appendChild(
   createSeasonCard(season,index,animeName)
  );

 });

}

/* ================================
   START
================================ */

renderAnimePage();
</script>

</body>
</html>
