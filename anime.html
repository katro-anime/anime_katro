<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الأنمي | KATRO Anime</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
}

header{
    background:#0d111c;
    padding:15px 20px;
    border-bottom:1px solid #202738;
}

.header-content{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#00b7ff;
    font-size:24px;
    font-weight:bold;
}

.home{
    color:white;
    text-decoration:none;
    background:#151c2c;
    padding:8px 15px;
    border-radius:8px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.back{
    display:inline-block;
    color:white;
    background:#1687d9;
    text-decoration:none;
    padding:10px 16px;
    border-radius:8px;
    margin-bottom:20px;
}

/* =========================
   معلومات الأنمي
========================= */

.anime-info{
    background:#0d111c;
    border-radius:15px;
    padding:20px;
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:25px;
}

.anime-info img{
    width:180px;
    height:260px;
    object-fit:cover;
    border-radius:12px;
    background:#151c2c;
}

.anime-text{
    flex:1;
}

.anime-text h1{
    color:#00b7ff;
    margin-bottom:12px;
    font-size:28px;
}

.anime-text p{
    color:#aeb6c5;
    font-size:16px;
    margin-bottom:8px;
}

/* =========================
   عنوان المواسم
========================= */

.section-title{
    color:#00b7ff;
    font-size:23px;
    margin-bottom:15px;
}

/* =========================
   المواسم
========================= */

.seasons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.season-card{
    background:#0d111c;
    border:1px solid #202738;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.season-card:hover{
    transform:translateY(-3px);
    border-color:#00b7ff;
}

.season-card.active{
    border:2px solid #00b7ff;
}

.season-card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#151c2c;
}

.season-info{
    padding:14px;
    text-align:center;
}

.season-info h3{
    color:white;
    margin-bottom:8px;
    font-size:17px;
}

.season-info p{
    color:#aeb6c5;
    font-size:14px;
}

/* =========================
   الحلقات
========================= */

.episodes-section{
    background:#0d111c;
    border-radius:15px;
    padding:20px;
    margin-bottom:25px;
}

.episodes-title{
    color:#00b7ff;
    margin-bottom:20px;
    font-size:22px;
}

.episodes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.episode{
    background:#151c2c;
    border:1px solid #202738;
    border-radius:10px;
    padding:14px;
    text-align:center;
}

.episode-number{
    display:block;
    margin-bottom:10px;
    color:#aeb6c5;
    font-size:15px;
}

.episode-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.watch-btn,
.download-btn{
    display:block;
    color:white;
    text-decoration:none;
    padding:10px 5px;
    border-radius:8px;
    font-size:14px;
    transition:.2s;
}

.watch-btn{
    background:#1687d9;
}

.watch-btn:hover{
    background:#00b7ff;
}

.download-btn{
    background:#151c2c;
    border:1px solid #1687d9;
}

.download-btn:hover{
    background:#1687d9;
}

/* =========================
   التحميل
========================= */

.loading{
    background:#0d111c;
    padding:30px;
    border-radius:15px;
    text-align:center;
    color:#aeb6c5;
}

.loading-spinner{
    width:35px;
    height:35px;
    border:4px solid #202738;
    border-top-color:#00b7ff;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   غير موجود
========================= */

.not-found{
    background:#0d111c;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#ff6b6b;
}

.not-found p{
    color:#aeb6c5;
    margin:12px 0 20px;
}

/* =========================
   الفوتر
========================= */

footer{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* =========================
   الهاتف
========================= */

@media(max-width:800px){

    .seasons{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .anime-info{
        flex-direction:column;
        text-align:center;
    }

    .anime-info img{
        width:160px;
        height:230px;
    }

    .seasons{
        grid-template-columns:1fr 1fr;
    }

    .episodes{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:400px){

    .seasons{
        grid-template-columns:1fr;
    }

    .episodes{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="header-content">

<div class="logo">
KATRO Anime
</div>

<a class="home"
href="index.html">
الرئيسية
</a>

</div>

</header>


<div class="container">


<a class="back"
href="index.html">
← العودة للأنميات
</a>


<div id="animeContainer">

    <div class="loading">

        <div class="loading-spinner"></div>

        جاري تحميل معلومات الأنمي...

    </div>

</div>


</div>


<footer>
© 2026 KATRO Anime
</footer>


<script>

/* =========================================
   إعدادات
========================================= */

const API =
"https://api.jikan.moe/v4";


const params =
new URLSearchParams(
window.location.search
);


const requestedName =
params.get("name");


const container =
document.getElementById(
"animeContainer"
);


/* =========================================
   الغلاف الافتراضي
========================================= */

const defaultCover =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="500"
height="700">

<rect width="100%"
height="100%"
fill="#151c2c"/>

<text x="50%"
y="45%"
text-anchor="middle"
fill="#00b7ff"
font-size="55"
font-family="Arial"
font-weight="bold">
KATRO
</text>

<text x="50%"
y="55%"
text-anchor="middle"
fill="white"
font-size="35"
font-family="Arial">
ANIME
</text>

</svg>
`);


/* =========================================
   تحويل الاسم إلى رابط آمن
========================================= */

function safe(value){

    return String(value || "")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


/* =========================================
   طلب Jikan
========================================= */

async function api(url){

    const response =
    await fetch(url);

    if(!response.ok){

        throw new Error(
            "API Error " +
            response.status
        );

    }

    return await response.json();

}


/* =========================================
   البحث عن الأنمي
========================================= */

async function findAnime(name){

    const result =
    await api(
        API +
        "/anime?q=" +
        encodeURIComponent(name) +
        "&limit=10"
    );


    if(!result.data ||
       result.data.length === 0){

        return null;

    }


    /*
       نحاول العثور على تطابق
       قوي مع الاسم المطلوب.
    */

    const exact =
    result.data.find(item => {

        const titles = [

            item.title,
            item.title_english,
            ...(item.title_synonyms || [])

        ];

        return titles
        .filter(Boolean)
        .some(title =>
            title.toLowerCase() ===
            name.toLowerCase()
        );

    });


    return exact ||
           result.data[0];

}


/* =========================================
   بيانات أنمي محددة داخل KATRO
========================================= */

const localData = {

    "Solo Leveling":{

        image:"Solo leveling .jpg",

        seasons:[

            {
                name:"الموسم الأول",
                episodes:12,
                image:"Solo leveling .jpg",
                watchId:"solo"
            },

            {
                name:"الموسم الثاني",
                episodes:13,
                image:"Solo leveling season 2.jpg",
                watchId:"solo-s2"
            }

        ]

    },


    "Demon Slayer":{

        image:"5a02947aed465c5b6a721884a87cdeca.jpg",

        seasons:[

            {
                name:"الموسم الأول",
                episodes:26,
                image:"5a02947aed465c5b6a721884a87cdeca.jpg",
                watchId:"Demon Slayer"
            },

            {
                name:"الموسم الثاني",
                episodes:11,
                image:"5a02947aed465c5b6a721884a87cdeca.jpg",
                watchId:"Demon Slayer"
            },

            {
                name:"الموسم الثالث",
                episodes:11,
                image:"5a02947aed465c5b6a721884a87cdeca.jpg",
                watchId:"Demon Slayer"
            },

            {
                name:"الموسم الرابع",
                episodes:8,
                image:"5a02947aed465c5b6a721884a87cdeca.jpg",
                watchId:"Demon Slayer"
            }

        ]

    }

};


/* =========================================
   أسماء يمكن دمجها
========================================= */

function normalizeTitle(title){

    return String(title || "")
    .toLowerCase()
    .replace(/season\s*\d+/g,"")
    .replace(/part\s*\d+/g,"")
    .replace(/cour\s*\d+/g,"")
    .replace(/[:\-–—]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================
   تحديد اسم الموسم
========================================= */

function seasonName(title,index){

    const text =
    String(title || "")
    .toLowerCase();


    if(
        /season\s*2|2nd season|second season/.test(text)
    ){
        return "الموسم الثاني";
    }


    if(
        /season\s*3|3rd season|third season/.test(text)
    ){
        return "الموسم الثالث";
    }


    if(
        /season\s*4|4th season|fourth season/.test(text)
    ){
        return "الموسم الرابع";
    }


    if(
        /season\s*5|5th season|fifth season/.test(text)
    ){
        return "الموسم الخامس";
    }


    if(
        /season\s*6|6th season|sixth season/.test(text)
    ){
        return "الموسم السادس";
    }


    if(
        /season\s*7|7th season|seventh season/.test(text)
    ){
        return "الموسم السابع";
    }


    return "الموسم " +
           arabicNumber(index + 1);

}


/* =========================================
   أرقام عربية
========================================= */

function arabicNumber(number){

    const numbers = [

        "الأول",
        "الثاني",
        "الثالث",
        "الرابع",
        "الخامس",
        "السادس",
        "السابع",
        "الثامن",
        "التاسع",
        "العاشر"

    ];

    return numbers[number - 1] ||
           String(number);

}


/* =========================================
   بناء موسم افتراضي
========================================= */

function makeDefaultSeason(anime){

    return {

        name:"الموسم الأول",

        episodes:
        anime.episodes || 0,

        image:
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        defaultCover,

        watchId:
        anime.title

    };

}


/* =========================================
   بناء قائمة المواسم
========================================= */

async function buildSeasons(anime){

    /*
       إذا كان لدينا إعداد يدوي
       داخل KATRO، استخدمه أولاً.
    */

    const local =
    localData[requestedName];


    if(local){

        return local.seasons;

    }


    const seasons = [];


    /*
       الموسم الأساسي
    */

    seasons.push({

        name:"الموسم الأول",

        episodes:
        anime.episodes || 0,

        image:
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        defaultCover,

        watchId:
        anime.title

    });


    /*
       الحصول على الأعمال المرتبطة
       بالأنمي.
    */

    try{

        const relationData =
        await api(
            API +
            "/anime/" +
            anime.mal_id +
            "/relations"
        );


        const sequelList = [];


        if(relationData.data){

            relationData.data.forEach(
                relation => {

                    if(
                        relation.relation ===
                        "Sequel"
                    ){

                        (relation.entry || [])
                        .forEach(entry => {

                            if(
                                entry.type ===
                                "anime"
                            ){

                                sequelList.push(
                                    entry
                                );

                            }

                        });

                    }

                }
            );

        }


        /*
           تحميل بيانات الأجزاء
        */

        for(
            const entry of sequelList
        ){

            try{

                const sequel =
                await api(
                    API +
                    "/anime/" +
                    entry.mal_id
                );


                const data =
                sequel.data;


                /*
                   الأفلام والـOVA
                   لا نحولها إلى موسم
                */

                if(
                    data.type !== "TV"
                ){

                    continue;

                }


                seasons.push({

                    name:
                    seasonName(
                        data.title,
                        seasons.length
                    ),

                    episodes:
                    data.episodes || 0,

                    image:
                    data.images?.jpg
                    ?.large_image_url ||
                    data.images?.jpg
                    ?.image_url ||
                    defaultCover,

                    watchId:
                    data.title

                });


            }
            catch(error){

                console.log(
                    "تعذر تحميل جزء:",
                    entry.mal_id
                );

            }

        }

    }
    catch(error){

        console.log(
            "تعذر تحميل العلاقات"
        );

    }


    return seasons;

}


/* =========================================
   عرض الصفحة
========================================= */

async function loadAnime(){

    if(!requestedName){

        showNotFound(
            "لم يتم تحديد اسم الأنمي."
        );

        return;

    }


    try{

        const anime =
        await findAnime(
            requestedName
        );


        if(!anime){

            showNotFound(
                "لم يتم العثور على هذا الأنمي."
            );

            return;

        }


        const local =
        localData[requestedName];


        const mainImage =
        local?.image ||
        anime.images?.jpg
        ?.large_image_url ||
        anime.images?.jpg
        ?.image_url ||
        defaultCover;


        const seasons =
        await buildSeasons(
            anime
        );


        renderAnime(
            anime,
            mainImage,
            seasons
        );

    }
    catch(error){

        console.error(error);


        /*
           إذا فشل API، نستخدم
           البيانات المحلية المعروفة.
        */

        const local =
        localData[requestedName];


        if(local){

            renderOffline(
                requestedName,
                local
            );

        }
        else{

            showNotFound(
                "تعذر تحميل معلومات الأنمي حاليًا. حاول مرة أخرى."
            );

        }

    }

}


/* =========================================
   عرض الأنمي
========================================= */

function renderAnime(
    anime,
    mainImage,
    seasons
){

    container.innerHTML = `

        <div class="anime-info">

            <img
                src="${mainImage}"
                alt="${safe(anime.title)}"
                onerror="this.src=defaultCover"
            >

            <div class="anime-text">

                <h1>
                    ${safe(anime.title)}
                </h1>

                <p>
                    عدد المواسم:
                    ${seasons.length}
                </p>

                <p>
                    الحالة:
                    ${safe(anime.status || "غير معروف")}
                </p>

                <p>
                    KATRO Anime
                </p>

            </div>

        </div>


        <h2 class="section-title">
            المواسم
        </h2>


        <div
            class="seasons"
            id="seasons">
        </div>


        <div
            class="episodes-section"
            id="episodesSection"
            style="display:none;"
        >

            <h2
                class="episodes-title"
                id="episodesTitle">
            </h2>


            <div
                class="episodes"
                id="episodes">
            </div>

        </div>

    `;


    createSeasonCards(
        seasons
    );

}


/* =========================================
   وضع عدم الاتصال
========================================= */

function renderOffline(
    name,
    local
){

    const fakeAnime = {

        title:name,

        status:"بيانات KATRO"

    };


    renderAnime(

        fakeAnime,

        local.image ||
        defaultCover,

        local.seasons

    );

}


/* =========================================
   بطاقات المواسم
========================================= */

function createSeasonCards(
    seasons
){

    const seasonsContainer =
    document.getElementById(
        "seasons"
    );


    seasons.forEach(
        (season,index) => {

            const card =
            document.createElement(
                "div"
            );


            card.className =
            "season-card";


            card.innerHTML = `

                <img
                    src="${season.image || defaultCover}"
                    alt="${safe(season.name)}"
                    onerror="this.src=defaultCover"
                >

                <div class="season-info">

                    <h3>
                        ${safe(season.name)}
                    </h3>

                    <p>
                        عدد الحلقات:
                        ${season.episodes || "غير معروف"}
                    </p>

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    document
                    .querySelectorAll(
                        ".season-card"
                    )
                    .forEach(
                        item =>
                        item.classList
                        .remove("active")
                    );


                    card.classList.add(
                        "active"
                    );


                    createEpisodes(
                        season
                    );


                    document
                    .getElementById(
                        "episodesSection"
                    )
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                }
            );


            seasonsContainer
            .appendChild(card);


            /*
               فتح أول موسم تلقائيًا
            */

            if(index === 0){

                setTimeout(
                    function(){

                        card.click();

                    },
                    100
                );

            }

        }
    );

}


/* =========================================
   الحلقات
========================================= */

function createEpisodes(
    season
){

    const episodesContainer =
    document.getElementById(
        "episodes"
    );


    const episodesSection =
    document.getElementById(
        "episodesSection"
    );


    const episodesTitle =
    document.getElementById(
        "episodesTitle"
    );


    episodesContainer.innerHTML =
    "";


    episodesTitle.textContent =
    season.name;


    episodesSection.style.display =
    "block";


    const number =
    parseInt(
        String(
            season.episodes || ""
        ).match(/\d+/)?.[0] ||
        "0"
    );


    if(!number){

        episodesContainer.innerHTML = `

            <p style="color:#aeb6c5;">

                عدد الحلقات غير متوفر حاليًا.

            </p>

        `;

        return;

    }


    const count =
    Math.min(
        number,
        500
    );


    for(
        let i=1;
        i<=count;
        i++
    ){

        const episodeBox =
        document.createElement(
            "div"
        );


        episodeBox.className =
        "episode";


        /*
           مهم جدًا:
           Solo Leveling S2
           يستخدم solo-s2
        */

        let watchId =
        season.watchId;


        /*
           أي جزء يحمل Solo Leveling
           Season 2 يستخدم المعرف الخاص
        */

        if(
            /solo leveling/i
            .test(watchId || "") &&
            /season\s*2/i
            .test(watchId || "")
        ){

            watchId =
            "solo-s2";

        }


        const watchURL =
        "watch.html?anime=" +
        encodeURIComponent(
            watchId
        ) +
        "&episode=" +
        i;


        const downloadURL =
        "download.html?anime=" +
        encodeURIComponent(
            watchId
        ) +
        "&episode=" +
        i;


        episodeBox.innerHTML = `

            <span class="episode-number">

                الحلقة ${i}

            </span>


            <div class="episode-buttons">

                <a
                    class="watch-btn"
                    href="${watchURL}"
                >

                    مشاهدة ▶

                </a>


                <a
                    class="download-btn"
                    href="${downloadURL}"
                >

                    تحميل ⬇

                </a>

            </div>

        `;


        episodesContainer
        .appendChild(
            episodeBox
        );

    }

}


/* =========================================
   رسالة الخطأ
========================================= */

function showNotFound(
    message
){

    container.innerHTML = `

        <div class="not-found">

            <h2>
                الأنمي غير موجود
            </h2>

            <p>
                ${safe(message)}
            </p>

            <a
                class="back"
                href="index.html"
            >

                العودة للرئيسية

            </a>

        </div>

    `;

}


/* =========================================
   تشغيل
========================================= */

loadAnime();

</script>

</body>
    </html>
