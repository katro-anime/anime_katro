*{

}

body{

header{
    background:#0d111c;

.header-content{
    max-width:1000px;

    justify-content:space-between;
}

.logo{
    color:#00b7ff;
    font-size:24px;

}

.home{
    color:white;
    text-decoration:none;
    background:#151c2c;
    padding:8px 15px;
    border-radius:8px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;

.back{

    color:white;
    background:#1687d9;

    border-radius:8px;

.anime-info{
    background:#0d111c;
    border-radius:15px;
    padding:20px;
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:25px;
}

.anime-info img{
    width:180px;
    height:260px;
    object-fit:cover;
    border-radius:12px;
    background:#151c2c;
}

.anime-text h1{
    color:#00b7ff;
    margin-bottom:12px;
    font-size:28px;
}

.anime-text p{
    color:#aeb6c5;
    font-size:16px;
    margin-bottom:8px;
}

.season{
    background:#0d111c;
    border-radius:15px;
    padding:20px;
}

.season h2{
    color:#00b7ff;
    margin-bottom:20px;
}

.episodes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.episode{
    background:#151c2c;
    border:1px solid #202738;
    border-radius:10px;
    padding:14px;
    text-align:center;
}

.episode-number{
    display:block;
    margin-bottom:10px;
    color:#aeb6c5;
}

.watch-btn{
    display:block;
    width:100%;
    background:#1687d9;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    transition:.2s;
}

.watch-btn:hover{
    background:#00b7ff;
}

.not-found{
    background:#0d111c;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#ff6b6b;
}

footer{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

@media(max-width:700px){

    .anime-info{
        flex-direction:column;
        text-align:center;
    }

    .anime-info img{
        width:160px;
        height:230px;
    }

    .episodes{
        grid-template-columns:repeat(2,1fr);
    }

}

/* =========================================
   إنشاء الحلقات
========================================= */

function createEpisodes(anime){

    const episodesContainer =
    document.getElementById("episodes");


    if(!episodesContainer){
        return;
    }


    /*
       نأخذ الرقم الأول من عدد الحلقات.
       مثال:
       220
       63+
       48+
    */

    const match =
    String(anime.episodes).match(/\d+/);


    if(!match){

        episodesContainer.innerHTML = `
            <p style="color:#aeb6c5;">
                لا توجد حلقات مضافة لهذا العنوان حاليًا.
            </p>
        `;

        return;
    }


    let episodeCount =
    parseInt(match[0]);


    /*
       حماية من إنشاء عدد ضخم جدًا
    */

    episodeCount =
    Math.min(episodeCount,500);


    for(
        let i=1;
        i<=episodeCount;
        i++
    ){

        const episodeBox =
        document.createElement("div");

        episodeBox.className =
        "episode";


        episodeBox.innerHTML = `

            <span class="episode-number">
                الحلقة ${i}
            </span>

            <a
                class="watch-btn"
                href="watch.html?anime=${encodeURIComponent(anime.name)}&episode=${i}"
            >
                مشاهدة ▶
            </a>

        `;


        episodesContainer.appendChild(
            episodeBox
        );

    }

}
