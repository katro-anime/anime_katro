</style></head><body><header><div class="header-content"><div class="logo">

</a></div></header><div class="container"><div class="info"><h1 id="title">

</h1><p>
اختر الجودة المناسبة للتحميل
</p></div><div class="download-box"><h2>
جودات الحلقة
</h2><div class="download-list"><a

</a></div></div><div class="download-box"><h2>

class="download-link disabled"
href="#">

⬇ تحميل الجزء كامل بجودة 720p

</a></div></div></div><footer>© 2026 KATRO Anime

</footer><script>


const params =
new URLSearchParams(window.location.search);

const anime =
params.get("anime") || "";

const episode =
params.get("episode") || "";


/* =========================
   عنوان الصفحة
========================= */

document.getElementById("title").textContent =
"تحميل الحلقة " + episode;


/* =========================
   روابط التحميل
=========================

   هنا نضيف الروابط مستقبلًا.

   حاليًا:
   480p للحلقة 2 من
   Solo Leveling الموسم الثاني
   هو الرابط الذي أرسلته.
========================= */


const downloads = {

    "solo-s2": {

        "2": {

            "480p":
            "https://pixeldrain.com/u/i5KLtXSr",

            "720p":
            "",

            "1080p":
            "",

            "full720":
            ""

        }

    }

};


/* =========================
   دالة تشغيل الرابط
========================= */

function setupDownload(id, url) {

    const button =
    document.getElementById(id);

    if (url && url.trim() !== "") {

        button.href = url;

        button.target = "_blank";

        button.classList.remove("disabled");

    } else {

        button.href = "#";

        button.classList.add("disabled");

        button.onclick = function(event) {

            event.preventDefault();

            alert(
                "رابط التحميل لهذه الجودة لم تتم إضافته بعد."
            );

        };

    }

}


/* =========================
   الحصول على روابط الحلقة
========================= */

let data = null;

if (
    downloads[anime] &&
    downloads[anime][episode]
) {

    data =
    downloads[anime][episode];

}


/* =========================
   تطبيق الروابط
========================= */

setupDownload(
    "quality480",
    data ? data["480p"] : ""
);

setupDownload(
    "quality720",
    data ? data["720p"] : ""
);

setupDownload(
    "quality1080",
    data ? data["1080p"] : ""
);

setupDownload(
    "full720",
    data ? data["full720"] : ""
);

</script></body></html>
